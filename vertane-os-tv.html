<style>

.strip{display:flex;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1) calc(var(--u)*6) calc(var(--u)*2.4);transition:transform .45s var(--out)}

.card{flex:0 0 auto;width:calc(var(--u)*25);height:calc(var(--u)*14);border-radius:calc(var(--u)*1.8);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--u)*1.4);font:600 calc(var(--u)*1.5)/1.2 var(--font);transition:transform .3s var(--out),box-shadow .3s;background-size:cover;text-shadow:0 1px 6px rgba(0,0,0,.4)}

/* écrans */

canvas.game{position:absolute;inset:0;width:100%;height:100%}

.tcap.on{transform:translateX(-50%);opacity:1}

.toast2.on{transform:none}
.toast2 .ico{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);flex:0 0 auto}
.toast2 b{display:block;font:600 calc(var(--u)*1.6)/1.2 var(--font)}
.toast2 span{font-size:calc(var(--u)*1.4);opacity:.85}
.voice{position:absolute;z-index:32;left:50%;bottom:calc(var(--u)*5);width:calc(var(--u)*64);margin-left:calc(var(--u)*-32);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.2);color:var(--ink);transform:translateY(150%);transition:transform .5s var(--spring)}
.voice.on{transform:none}
.voice .q{color:var(--ink-2);font-size:calc(var(--u)*1.6)}
.voice .a{font-size:calc(var(--u)*1.9);line-height:1.4;margin-top:calc(var(--u)*.8)}
.voice .wave{height:calc(var(--u)*3);color:var(--accent);gap:calc(var(--u)*.4)}
.voice .wave i{width:calc(var(--u)*.5)}

.vglow.on{opacity:1}
.boot3{position:absolute;inset:0;z-index:50;background:#000;display:none;place-items:center}
.boot3.on{display:grid}
.boot3 img{width:calc(var(--u)*10);animation:fi 1s}
.off3{position:absolute;inset:0;z-index:51;background:#000;display:none}
.off3.on{display:block}
</style>

<body>
<script>
(function(){
"use strict";
const doc=document,Q=new URLSearchParams(location.search),EMBED=window.parent!==window,MODE=['tv','salon','portable'].indexOf(Q.get('d'))>=0?Q.get('d'):'tv';
const $=(s,r)=>(r||doc).querySelector(s),$$=(s,r)=>Array.from((r||doc).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wait=ms=>new Promise(r=>setTimeout(r,ms));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const S=(d,sw)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const G={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.3 2.7-.7.4 2.8 2.6 1.1-1.2 2.5 1.2 2.5-2.6 1.1-.4 2.8-2.7-.7L12 21.2l-1.6-2.3-2.7.7-.4-2.8-2.6-1.1L5.9 13 4.7 10.5l2.6-1.1.4-2.8 2.7.7z"/>',
  play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',pause:'<path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z" fill="currentColor" stroke="none"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',
  pad:'<path d="M7 9h4M9 7v4M15 10h0M18 8h0"/><rect x="2.5" y="5" width="19" height="12" rx="6"/>',batt:'<rect x="3" y="7" width="16" height="10" rx="2.5"/><path d="M21 10.5v3"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 13V9M10 2.5h4"/>',
  down:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/>',info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',spark:'<path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z" fill="currentColor" stroke="none"/>',box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  note:'<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/>',video:'<rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3z"/>'};
const VL='<svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M537 700H490L682 276H795L572 748H452L229 276H343Z"/></svg>';
const TV=MODE==='tv',GAME=!TV,PORT=MODE==='portable';

/* contenus (titres inventés pour la démo) */
const ART=[ 'radial-gradient(60% 60% at 70% 30%,#f4a6d8,transparent 70%),radial-gradient(60% 60% at 20% 70%,#4F7BF0,transparent 70%),linear-gradient(160deg,#2a2170,#0b0820)',
  'radial-gradient(60% 60% at 30% 30%,#ffb38a,transparent 70%),radial-gradient(60% 60% at 80% 80%,#a45a3f,transparent 70%),linear-gradient(160deg,#5a2330,#1b0d10)',
  'radial-gradient(60% 60% at 60% 30%,#9fd1b0,transparent 70%),radial-gradient(60% 60% at 20% 80%,#2d7e74,transparent 70%),linear-gradient(160deg,#16372f,#081410)',
  'radial-gradient(60% 60% at 40% 30%,#ffd36b,transparent 70%),radial-gradient(60% 60% at 80% 80%,#f09a26,transparent 70%),linear-gradient(160deg,#5a3a10,#1b1206)',
  'radial-gradient(60% 60% at 70% 40%,#9ad7ff,transparent 70%),radial-gradient(60% 60% at 20% 70%,#3E6FB0,transparent 70%),linear-gradient(160deg,#1a2d45,#0a1220)',
  'radial-gradient(60% 60% at 50% 30%,#c7b8ff,transparent 70%),radial-gradient(50% 50% at 20% 80%,#8537E0,transparent 70%),linear-gradient(160deg,#241a3a,#0e0a18)'];
const DATA=TV?{tabs:['Pour toi','Films','Séries','Apps','Vertane'],
  hero:[{t:'Les Réparateurs',e:'Nouvelle série',d:'Dans un atelier de Lyon, quatre amis redonnent vie aux objets que tout le monde jette. Saison 1.',m:['2026','Série','8 épisodes'],a:0},{t:'Verre et lumière',e:'Documentaire',d:'Comment on fabrique un écran, de la dune de sable à ta poche.',m:['2025','1 h 32'],a:4}],
  rows:[['Continuer',[['Les Réparateurs','Épisode 3 · 24 min restantes',0,.6],['Minuit à Lyon','Film · 40 min restantes',5,.3],['Planète durable','Épisode 6',2,.8],['Cuisine du marché','Épisode 2',3,.15]]],
        ['Apps',[['Vertane','app:vertane'],['Musique','app:music'],['Photos','app:photos'],['Réglages','app:settings'],['Jeux','app:game']]],
        ['Recommandé',[['La Grande Traversée','Film',1],['Sauge','Série',2],['Terracotta','Documentaire',3],['Orbite','Film d’animation',5],['Le Dernier Atelier','Film',0]]]]}
 :{tabs:['Accueil','Jeux','Boutique','Amis','Vertane'],
  hero:[{t:'Orbite',e:'Jeu du moment',d:'Pilote ta sonde entre les planètes et ramasse les étoiles. Change d’orbite au bon moment.',m:['Action','1 joueur','Hors ligne'],a:5,game:1},{t:'Atelier Rush',e:'Nouveau',d:'Répare les objets avant la fermeture : chaque module compte.',m:['Réflexion','1 à 4 joueurs'],a:1,game:1}],
  rows:[['Récemment joué',[['Orbite','74 % terminé',5,.74,1],['Atelier Rush','Niveau 12',1,.4,1],['Sentiers','Carte 3',2,.2,1],['Course des modules','Coupe Sauge',3,.55,1]]],
        ['Apps',[['Vertane','app:vertane'],['Musique','app:music'],['Captures','app:photos'],['Réglages','app:settings']]],
        ['Ta bibliothèque',[['Orbite','Installé · 4,2 Go',5,0,1],['Atelier Rush','Installé · 12 Go',1,0,1],['Sentiers','Installé · 8 Go',2,0,1],['Course des modules','Installé · 30 Go',3,0,1],['Constellations','Téléchargement…',4,0,1]]]]};
const DEVN=TV?'Boîtier TV Vertane':PORT?'Console portable Vertane':'Console de salon Vertane';
const KEY='vos1-tv-'+MODE;
function fresh(){return TV?{cfg:{sto:128,remote:'std'},usage:{days:200},parts:{},batt:null}:PORT?{cfg:{batt:'std',stickL:'std',stickR:'std',sto:1024},usage:{days:260,cycles:310,driftL:6.2,driftR:1.4,hours:620},parts:{},batt:71}:{cfg:{sto:2048,fan:'std',pad:'std'},usage:{days:320,fanH:1900,driftL:3.1,driftR:.8,padBatt:64},parts:{},batt:null};}
let DS=Object.assign(fresh(),LS.get(KEY,{}));const save=()=>{LS.set(KEY,DS);sync();};

/* ---------- structure ---------- */
const root=doc.createElement('div');root.className='tv os';root.dataset.theme='dark';
root.innerHTML='<div class="bg" id="bg"></div><div class="top" id="top"></div><div class="hero" id="hero"></div><div class="rows" id="rows"></div>'+
  '<div class="scr2 player" id="player"></div><div class="scr2" id="app"></div><div class="scr2" id="game"><canvas class="game" id="cv"></canvas><div class="hud2" id="hud"></div></div>'+
  '<div class="tcap" id="tcap"></div><div class="toast2 gl dk" id="toast"></div><div class="vglow" id="vglow"></div><div class="voice gu" id="voice"></div><div class="boot3" id="boot"><img src="assets/logo/vertane-icone-principal.svg" alt=""></div><div class="off3" id="off"></div>';
doc.body.appendChild(root);
function scale(){const k=Math.min(innerWidth/1280,innerHeight/720);root.style.setProperty('--u',(10*k).toFixed(2)+'px');}
addEventListener('resize',scale);scale();

/* ---------- focus au clavier (télécommande) ---------- */
let tabI=0,heroI=0,zone='rows',rowI=0,colI=[0,0,0],heroBtn=0,topI=0;
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function renderTop(){$('#top').innerHTML='<div class="logo"><span>'+VL+'</span>'+(TV?'Vertane TV':'Vertane Jeu')+'</div>'+DATA.tabs.map((t,i)=>'<button class="tab f'+(i===tabI?' cur':'')+'" data-z="top" data-i="'+i+'">'+esc(t)+'</button>').join('')+'<span class="sp"></span>'+
  '<button class="ti f" data-z="top" data-i="'+DATA.tabs.length+'" aria-label="Rechercher">'+S(G.search)+'</button><button class="ti f" data-z="top" data-i="'+(DATA.tabs.length+1)+'" aria-label="Parler">'+S(G.mic)+'</button>'+
  (GAME?'<span class="pad">'+S(PORT?G.batt:G.pad)+(PORT?DS.batt+' %':DS.usage.padBatt+' %')+'</span>':'')+'<span class="clock">'+hm(new Date())+'</span><span class="av">L</span>';}
function heroData(){return DATA.hero[heroI%DATA.hero.length];}

/* ---------- mini-jeu : Orbite ---------- */
const GM={on:false};
function openGame(name){overlay='game';$('#game').classList.add('on');const cv=$('#cv'),x=cv.getContext('2d');cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;
  Object.assign(GM,{on:true,a:0,orb:1,ro:1,score:0,dir:1,stars:Array.from({length:6},()=>({a:Math.random()*6.28,o:Math.floor(Math.random()*3)})),bg:Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()])});
  capSet({l:S(G.pad),r:'Orbite · en jeu'},2000);
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=[H*.18,H*.28,H*.38];
  const loop=()=>{if(!GM.on)return;GM.ro+=(GM.orb-GM.ro)*.12;GM.a+=.02*GM.dir*(GM.boost?2:1);GM.boost=0;
    x.fillStyle='#07060f';x.fillRect(0,0,W,H);GM.bg.forEach(s=>{x.fillStyle='rgba(255,255,255,'+(s[2]*.8)+')';x.fillRect(s[0]*W,s[1]*H,2,2);});
    R.forEach(r=>{x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=2;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();});
    const g=x.createRadialGradient(cx-H*.03,cy-H*.03,5,cx,cy,H*.1);g.addColorStop(0,'#ffb38a');g.addColorStop(1,'#a45a3f');x.fillStyle=g;x.beginPath();x.arc(cx,cy,H*.1,0,7);x.fill();
    const rr=R[0]+(R[2]-R[0])*GM.ro/2,px=cx+Math.cos(GM.a)*rr,py=cy+Math.sin(GM.a)*rr;
    GM.stars.forEach(s=>{const sx=cx+Math.cos(s.a)*R[s.o],sy=cy+Math.sin(s.a)*R[s.o];x.fillStyle='#F6C343';x.beginPath();x.arc(sx,sy,H*.012,0,7);x.fill();
      if(Math.hypot(sx-px,sy-py)<H*.03){GM.score++;s.a=Math.random()*6.28;s.o=Math.floor(Math.random()*3);}});
    x.fillStyle='#8DB89A';x.shadowColor='#8DB89A';x.shadowBlur=20;x.beginPath();x.arc(px,py,H*.016,0,7);x.fill();x.shadowBlur=0;
    $('#hud').innerHTML='Orbite · '+GM.score+' étoile'+(GM.score>1?'s':'')+'<small>Haut / bas : change d’orbite · Gauche / droite : sens · B : quitter</small>';
    requestAnimationFrame(loop);};loop();sync();}
function stopGame(){GM.on=false;}

async function swap(part,patch){post('swap:start',{part});closeOverlay();$('#off').classList.add('on');await wait(2600);Object.keys(patch).forEach(k=>{let v=patch[k];if(k==='sto')v=+v;DS.cfg[k]=v;});
  const u=DS.usage;DS.parts[part]={cy:u.cycles,dr:part==='stickL'||part==='pad'?u.driftL:part==='stickR'?u.driftR:0,fh:u.fanH};save();
  $('#off').classList.remove('on');$('#boot').classList.add('on');await wait(1800);$('#boot').classList.remove('on');
  const lab=catalog().find(p=>p.k===part);capSet({l:'<span style="color:#8DB89A">'+S(G.check,2.4)+'</span>Nouveau module',r:esc(lab?lab.t:'')},3500);setTimeout(()=>toast((lab?lab.t:'Module')+' reconnu','Ouvre l’app Vertane pour voir son état.'),1500);post('swap:done',{part});}
function age(days){const k=days/365,u=DS.usage;u.days+=days;if(PORT){u.cycles+=Math.round(300*k);u.driftL+=3*k;u.driftR+=1.2*k;u.hours+=Math.round(500*k);}else if(!TV){u.fanH+=Math.round(1400*k);u.driftL+=2*k;u.driftR+=.8*k;}save();toast('Bilan de santé','Ouvre l’app Vertane pour voir l’usure des modules.');if(overlay==='app')openVertane();}

/* ---------- pont avec la page ---------- */
function post(evt,data){if(!EMBED)return;try{parent.postMessage({vos:1,evt,data:data||{}},'*');}catch(e){}}
let st=0;function sync(){clearTimeout(st);st=setTimeout(()=>post('state',{dev:MODE,name:DEVN,setup:true,screen:$('#off').classList.contains('on')?'off':'on',locked:false,app:overlay==='app'?'vertane':overlay,batt:PORT?DS.batt:null,cfg:DS.cfg,catalog:catalog(),theme:'dark',score:Math.max(20,100-tips().filter(t=>t[0]==='warn').length*14-tips().filter(t=>t[0]==='tip').length*5)}),120);}
const CMD={key:d=>{const k=d.k;if(k==='up')move(0,-1);else if(k==='down')move(0,1);else if(k==='left')move(-1,0);else if(k==='right')move(1,0);else if(k==='ok')ok();else if(k==='back')back();else if(k==='home')home();else if(k==='play'){if(overlay==='player')togglePlay();else music();}else if(k==='x'||k==='y'||k==='l'||k==='r'||k==='stickL'||k==='stickR'){if(overlay==='game')GM.boost=1;else toast('Manette','Bouton '+k.toUpperCase()+' reçu.');}},
  ai:d=>voice(d.text),powerLong:()=>voice(),power:()=>{$('#off').classList.toggle('on');sync();},home:()=>home(),back:()=>back(),
  notify:d=>{if(d.app==='friend')toast('Léa est en ligne','Elle joue à Orbite. Rejoins-la ?','linear-gradient(160deg,#8DB89A,#2F7A55)');else toast('Livraison','Ta manette à effet Hall arrive demain.');},
  call:d=>{capSet({l:'<span style="color:#34C46A">'+S(G.video,2)+'</span>'+esc(d.name||'Léa'),r:'Appel vidéo'},4000);},timer:d=>timer(d.sec||300),music:()=>music(),
  charge:d=>{if(PORT){capSet({l:'En charge',r:'<span style="color:#34C46A">'+DS.batt+' %</span>'},2400);}},battery:d=>{if(PORT){DS.batt=clamp(d.level|0,1,100);renderTop();if(DS.batt<=15)toast('Batterie faible','Il reste '+DS.batt+' %. Branche le câble USB-C.');}},
  open:d=>{if(d.app==='vertane')openVertane();},swap:d=>swap(d.part,d.patch||{}),age:d=>age(d.days||365),reset:()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();},state:()=>sync()};
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.vos||!CMD[m.cmd])return;try{CMD[m.cmd](m.data||{});}catch(err){console.error(err);}});
setInterval(()=>{const c=$('.clock');if(c)c.textContent=hm(new Date());},10000);
if(!TV&&!PORT)setTimeout(()=>{DATA.rows[2][1][4][1]='Téléchargement… 62 %';capSet({l:S(G.down),r:'Constellations · 62 %'},3500);},2500);

renderTop();renderHero();renderRows();zone='hero';applyFocus();
setTimeout(()=>{post('ready',{});sync();},50);
})();
</script>
</body>
</html>
