<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acheter — Vertane</title>
<meta name="description" content="Achète ton appareil Vertane, ou compose-le sur mesure, module par module.">
<meta name="theme-color" content="#F3F1EA">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/vertane-favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo/vertane-apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vertane.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script src="assets/devices.js"></script>
<style>
.buy-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-top:112px;padding-bottom:28px}
.buy-head .eyebrow{margin-bottom:8px}
.buy-head p.muted{margin:10px 0 0;font-size:15px}
.head-links{display:flex;flex-wrap:wrap;gap:8px 24px}
.head-links .link{font-size:15px}

.buy-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:start}
.viewer-col{position:sticky;top:84px}
.viewer{position:relative;height:calc(100vh - 190px);height:calc(100svh - 190px);min-height:440px;max-height:860px;border-radius:var(--r-l);background:var(--blanc);overflow:hidden}
.viewer img{position:absolute;left:0;right:0;top:9%;margin:0 auto;height:74%;width:auto;max-width:none;opacity:0;transform:scale(.97);transition:opacity .55s var(--ease),transform .9s var(--ease-out);filter:drop-shadow(0 26px 34px rgba(22,24,26,.15))}
.viewer img.on{opacity:1;transform:none}
.v-cap{position:absolute;left:24px;top:22px;right:24px;margin:0;font-size:14px;color:var(--pierre);pointer-events:none;z-index:2}
.v-cap b{display:block;font:500 17px/1.3 var(--display);color:var(--noir);letter-spacing:-.01em;margin-bottom:2px}
.v-ctrl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(243,241,234,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(201,196,184,.6);z-index:2}
.v-ctrl button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:13.5px;color:var(--noir);transition:background .2s,color .2s}
.v-ctrl button:hover{background:rgba(22,24,26,.06)}
.v-ctrl button[aria-pressed="true"]{background:var(--noir);color:var(--ivoire)}

.step{padding:0 0 52px;margin-bottom:52px;border-bottom:1px solid var(--lin);scroll-margin-top:96px;transition:opacity .5s var(--ease)}
.step:last-child{border-bottom:0}
.step.locked{opacity:.34;pointer-events:none;user-select:none}
.step h2{font:500 clamp(24px,2.4vw,30px)/1.2 var(--display);letter-spacing:-.02em;margin:0 0 22px}
.step h2 span{color:var(--pierre)}
.step .help{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;margin-top:16px;color:var(--vert);font-size:15px}
.step .help svg{width:20px;height:20px}
.step .help:hover{text-decoration:underline;text-underline-offset:.18em}
.step-note{margin:14px 0 0;font-size:14px;color:var(--pierre)}
.col-name{font:600 15px/1.3 var(--text);margin:0 0 14px}
.col-name span{font-weight:400;color:var(--pierre)}
.step .swatches{gap:14px}
.step .sw{width:44px;height:44px}
.step .sw span{inset:5px}
.inc{margin-top:22px;border-radius:var(--r-m);background:var(--blanc);padding:4px 20px}
.inc summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;cursor:pointer;list-style:none;font-size:15px;font-weight:600}
.inc summary::-webkit-details-marker{display:none}
.inc summary svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.inc[open] summary svg{transform:rotate(180deg)}
.inc ul{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--lin-2)}
.inc li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--lin-2);font-size:14px}
.inc li:last-child{border-bottom:0}
.inc li span:first-child{color:var(--pierre)}
.inc li span:last-child{text-align:right}
.to-custom{display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:16px 20px;border-radius:var(--r-m);box-shadow:inset 0 0 0 1px var(--lin);font-size:14px;color:var(--pierre)}
.to-custom svg{width:24px;height:24px;flex:0 0 auto;color:var(--vert)}
.to-custom b{display:block;color:var(--noir);font-weight:600;margin-bottom:2px}
.to-custom button{border:0;background:none;padding:0;text-align:left;color:var(--vert);font-size:14px;margin-top:4px}
.to-custom button:hover{text-decoration:underline}
.trade-extra{display:grid;gap:14px;margin-top:18px}
.trade-val{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px;border-radius:var(--r-s);background:rgba(47,122,85,.08);color:var(--vert);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .choice{flex:1 1 90px;align-items:center;text-align:center;padding:14px 10px}

.recap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center;background:var(--blanc);border-radius:var(--r-l);padding:clamp(28px,5vw,64px);margin:24px 0 120px}
.recap-img{display:flex;justify-content:center}
.recap-img img{height:min(460px,60vw);width:auto;max-width:100%;object-fit:contain}
.recap ul{list-style:none;margin:22px 0;padding:0;border-top:1px solid var(--lin-2)}
.recap li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--lin-2);font-size:14.5px}
.recap li b{display:block;font-weight:600}
.recap li small{color:var(--pierre)}
.recap li span:last-child{white-space:nowrap}
.recap .tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 4px}
.recap .tot b{font:500 30px/1.1 var(--display);letter-spacing:-.03em}
.recap .ship{display:flex;gap:10px;align-items:flex-start;margin:18px 0 24px;font-size:14px;color:var(--pierre)}
.recap .ship svg{width:22px;height:22px;flex:0 0 auto;color:var(--noir)}
.recap .ship b{color:var(--noir);font-weight:600}

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -1px 0 rgba(201,196,184,.7);transform:translateY(110%);transition:transform .5s var(--ease-out)}
.buybar.on{transform:none}
.buybar .shell{display:flex;align-items:center;gap:16px 28px;min-height:76px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bb-price{display:flex;flex-direction:column}
.bb-price b{font:500 22px/1.15 var(--display);letter-spacing:-.02em}
.bb-price span{font-size:13px;color:var(--pierre)}
.bb-ship{margin-left:auto;font-size:13px;color:var(--pierre);text-align:right}
.bb-ship b{display:block;color:var(--noir);font-weight:600}

@media (max-width:980px){
  .buy-head{padding-top:96px}
  .buy-grid{grid-template-columns:1fr}
  .viewer-col{top:76px;z-index:5;margin:0 calc(-1*var(--gut));padding:0 var(--gut) 10px;background:linear-gradient(var(--ivoire) 88%,rgba(243,241,234,0));box-shadow:0 -90px 0 var(--ivoire)}
  .viewer{height:34svh;min-height:240px;border-radius:var(--r-m)}
  .viewer img{top:6%;height:80%}
  .v-cap{display:none}
  .v-ctrl{bottom:8px;padding:4px}.v-ctrl button{padding:6px 12px;font-size:12px}
  .step{scroll-margin-top:calc(76px + 34svh + 24px)}
  .recap{grid-template-columns:1fr}
  .bb-ship{display:none}
  .buybar .btn{margin-left:auto}
}

/* pliant : aperçu 3D, image fixe en attendant */
.viewer img{top:8%;height:80%;width:auto;object-fit:contain}
.viewer .v-3d{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease)}
.viewer.ready .v-3d{opacity:1}.viewer.ready #vFront{opacity:0}
.v-hint{position:absolute;right:24px;top:22px;margin:0;font-size:13px;color:var(--pierre);pointer-events:none;z-index:2}
.grp{margin-bottom:26px}
.grp:last-child{margin-bottom:0}
.grp .choices{gap:10px}
.grp .choice{padding:14px 18px}
.c-why{font-size:13px;color:#9A3A1E;margin-top:2px}
.sw-row{margin-bottom:22px}
.recap-img img{height:min(460px,60vw);width:auto;max-width:100%}
@media (max-width:980px){.viewer img{top:6%;height:84%}.v-hint{display:none}}
.viewer img{top:10%;height:76%}
</style>
</head>
<body data-page="appareil">
<script>(function(){const D=window.DEV.fam(new URLSearchParams(location.search).get('d'));if(!D){location.replace('store.html');return;}window.DF=D;document.body.dataset.page=D.k;})();</script>
<script src="assets/site.js"></script>
<main id="main">
  <header class="shell buy-head">
    <div><p class="eyebrow">Acheter</p><h1 class="h1" id="title"></h1><p class="muted" id="fromPrice"></p></div>
    <div class="head-links"><a class="link" id="toCmp" href="#">Comparer les modèles</a><a class="link" id="toMesure" href="#">Sur mesure</a><a class="link" id="to3d" href="#">Configurateur 3D</a><a class="link" id="toDisc" href="#">Découvrir</a></div>
  </header>
  <div class="shell buy-grid">
    <div class="viewer-col">
      <div class="viewer" id="viewer" aria-live="polite">
        <p class="v-cap" id="vcap"></p>
        <img id="vFront" alt="" class="on" width="900" height="900">
        <div class="v-3d" id="v3d"></div>
        <p class="v-hint" id="vHint"></p>
        <div class="v-ctrl" role="group" aria-label="Vue" id="vctrl"></div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="shell"><section class="recap" id="recap" hidden aria-labelledby="recap-t"></section></div>
</main>

<div class="buybar" id="buybar" aria-label="Prix et ajout au panier">
  <div class="shell">
    <div class="bb-price"><b id="bbPrice"></b><span id="bbMonthly"></span></div>
    <div class="bb-ship" id="bbShip"></div>
    <button class="btn" id="bbBtn">Continuer</button>
  </div>
</div>

<template id="foot-notes">
  <ol>
    <li>Paiement en 12 fois sans frais, sous réserve d’acceptation. Montants arrondis au centime supérieur. Prix TTC, livraison offerte en France métropolitaine.</li>
    <li>Estimations de prototype.</li>
  </ol>
</template>

<script>
(function(){
"use strict";
const D=window.DF,V=window.V,$=s=>document.querySelector(s),esc=V.esc,money=V.money;
const CARE={name:'Vertane Care, 2 ans',price:D.care};
const COMP=Object.keys(D.OPT);/* modules du sur mesure (la matière comprise) */
const VW=D.VIEWS;

/* état ; entrée par ?d=&m=&c=&s=&edit=&from=config */
const qp=new URLSearchParams(location.search);
let m=D.byK(qp.get('m')),fin=null,cap=null,comp=null,col=null,care=null,view=VW[0][0];
const done={modele:!!m};
if(!m)m=D.MODELS[0];
const editId=qp.get('edit'),edited=editId&&V.Bag.items().find(x=>x.id===editId&&x.type==='device'&&x.fam===D.k);
if(edited){m=D.byK(edited.model)||m;done.modele=true;fin=edited.fin;cap=edited.cap||null;done.couleur=done.stockage=done.composants=true;
  if(m.k==='mesure'){comp={};COMP.concat('tier').forEach(k=>comp[k]=edited.cfg[k]);col=edited.cfg.ccol;}care=!!edited.care;}
if(!edited&&qp.get('c')&&m.fins.some(f=>f[0]===qp.get('c'))){fin=qp.get('c');done.couleur=true;}
if(!edited&&qp.get('s')&&m.caps&&m.caps.indexOf(+qp.get('s'))>=0){cap=+qp.get('s');done.stockage=true;}
if(!edited&&qp.get('from')==='config'&&m.k==='mesure')try{const s=JSON.parse(localStorage.getItem('dev-config-'+D.k)||'null');
  if(s){const c=Object.assign({},D.DEF,s);D.fix(c);comp={};COMP.concat('tier').forEach(k=>comp[k]=c[k]);col=c.ccol;cap=c.cap||null;done.composants=done.couleur=done.stockage=true;}}catch(e){}
function startMesure(c){c=c||D.cfgOf(D.MODELS[D.MODELS.length-1]);comp={};COMP.concat('tier').forEach(k=>comp[k]=c[k]);col=c.ccol;}
if(m.k==='mesure'&&!comp)startMesure();
const hasSto=()=>!!D.CAPP;
const steps=()=>[{k:'modele',t:'Modèle.',s:'Lequel est fait pour toi ?'}].concat(m.k==='mesure'?[{k:'composants',t:'Modules.',s:'Choisis chaque pièce.'}]:[],
  [{k:'couleur',t:'Couleur.',s:'Une seule teinte, sur toutes les pièces.'}],hasSto()?[{k:'stockage',t:'Stockage.',s:'Quelle place te faut-il ?'}]:[],[{k:'care',t:'Vertane Care.',s:'Protège ton appareil.'}]);
const caps=()=>m.caps||D.caps||[];
const curFin=()=>fin||m.fins[0][0],curCap=()=>cap||caps()[0];
function cfg(){if(m.k!=='mesure')return D.cfgOf(m,curFin(),curCap());const c=Object.assign({},D.DEF,comp,{ccol:col||comp.ccol});if(hasSto())c.cap=curCap();D.fix(c);return c;}
const price=()=>m.k==='mesure'?D.to9(D.price(cfg())):D.priceM(m,curCap());
function isDone(s){if(s.k==='care')return care!==null;return !!done[s.k];}
const unlockedIdx=()=>{const S=steps();let i=0;while(i<S.length&&isDone(S[i]))i++;return i;};
const allDone=()=>steps().every(isDone);
const total=()=>price()+(care?CARE.price:0);
const finName=()=>{const c=cfg();return m.k==='mesure'?D.fin(c):D.finOf(m,curFin())[1];};
const nameOf=x=>'Vertane '+x.name;
function still(){if(m.k!=='mesure')return D.img(m,curFin());const c=cfg(),f=D.MESURE.fins.find(x=>(x[2].cmat||c.cmat)===c.cmat&&x[0]===c.ccol)||D.MESURE.fins.find(x=>!x[2].cmat||x[2].cmat===c.cmat)||D.MESURE.fins[0];return D.img(D.MESURE,f[0]);}

/* ---------- aperçu ---------- */
$('#vctrl').innerHTML=VW.map((v,i)=>'<button data-v="'+v[0]+'" aria-pressed="'+(i===0)+'">'+esc(v[1])+'</button>').join('');
let lastK='';
function gallery(){const c=cfg(),f=$('#vFront'),src=still();if(f.getAttribute('src')!==src)f.src=src;f.alt=nameOf(m)+', '+finName();
  if(window.D3D){const k=JSON.stringify(D.d3(c));if(k!==lastK){lastK=k;window.D3D.set(D.d3(c));}}
  $('#vctrl').querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===view));
  $('#vcap').innerHTML='<b>'+esc(nameOf(m))+'</b>'+esc(finName()+(hasSto()&&done.stockage?' · '+D.capL(curCap()):''));}
function setView(v,now){view=v;if(window.D3D){window.D3D.anim({e:0,resetLift:true,lift:v==='open'?Object.values(D.PEEL)[0]:{},instant:!!now});window.D3D.view(v,!now);}gallery();}
window.addEventListener('dev-3d',()=>{$('#viewer').classList.add('ready');$('#vHint').textContent=window.D3D.touch?'':'Fais glisser pour tourner';lastK='';gallery();setView(view,true);});
$('#vctrl').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)setView(b.dataset.v);});

/* ---------- étapes ---------- */
const radio=(name,v,on,dis)=>'<input type="radio" name="'+name+'" value="'+v+'"'+(on?' checked':'')+(dis?' disabled':'')+'>';
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function compGroup(f){const c=cfg(),cur=c[f],o0=D.OPT[f];if(o0.length<2)return '';const base=Math.min(...o0.map(o=>o.p));
  return '<div class="grp"><p class="col-name">'+esc(D.LABELS[f]||f)+'</p><div class="choices" role="radiogroup" aria-label="'+esc(D.LABELS[f]||f)+'">'+o0.map(o=>{const on=o.v===cur,w=on?null:D.why(f,o.v,c),d=o.p-base;
    return '<label class="choice'+(on?' on':'')+(w?' dis':'')+'">'+radio(f,o.v,on,!!w)+'<span class="c-row"><span class="c-t">'+esc(o.t)+(o.d?'<small>'+esc(o.d)+'</small>':'')+'</span><span class="c-p">'+(d>0?'+ '+money(d):'')+'</span></span>'+(w?'<span class="c-why">'+esc(w)+'</span>':'')+'</label>';}).join('')+'</div></div>';}
function sw(list,cur,label){return '<div class="sw-row"><p class="col-name">'+label+' <span>'+esc((list.find(x=>x[0]===cur)||list[0])[1])+'</span></p><div class="swatches" role="radiogroup" aria-label="'+label+'">'+list.map(x=>{const on=x[0]===cur;
  return '<label class="sw'+(on?' on':'')+'" title="'+esc(x[1])+'"><input type="radio" name="ccol" value="'+x[0]+'"'+(on?' checked':'')+' aria-label="'+esc(x[1])+'"><span style="--c:'+x[2]+'"></span></label>';}).join('')+'</div></div>';}
const capUse=v=>v<=64?'Pour les applis et les films en streaming':v<=128?'Quelques jeux et films hors ligne':v<=256?'De la place pour tes jeux et tes films':v<=512?'Une belle bibliothèque':v<=1024?'Beaucoup de jeux et de vidéo':'Tout garder sur toi';
function stepHTML(s,i,ul){const locked=i>ul,id='etape-'+s.k,c=cfg();let b='';
  if(s.k==='modele'){b='<div class="choices" role="radiogroup" aria-label="Modèle">'+D.ALL.map(x=>{const on=done.modele&&x.k===m.k;
      return '<label class="choice'+(on?' on':'')+'">'+radio('model',x.k,on)+(x.tag?'<span class="c-tag">'+esc(x.tag)+'</span>':'')+'<span class="c-row"><span class="c-t">'+esc(nameOf(x))+'<small>'+esc(x.pitch)+'</small></span><span class="c-p"><small>À partir de</small>'+money(D.from(x))+'</span></span><span class="c-d">'+esc(x.blurb)+'</span></label>';}).join('')+'</div>'+
    (m.k==='mesure'?'':'<details class="inc"><summary>Ce qui est inclus dans le '+esc(m.name)+CHEV+'</summary><ul>'+D.specs(c).map(r=>'<li><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></li>').join('')+'</ul></details>'+
      '<div class="to-custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span><b>Envie de changer un module ?</b>Sur ce modèle, tu choisis la couleur'+(hasSto()?' et le stockage':'')+'. Pour le reste, pars de ce modèle en sur mesure.<br><button type="button" id="toCustom">Personnaliser le '+esc(m.name)+' module par module</button></span></div>');}
  else if(s.k==='composants'){b=COMP.map(compGroup).join('')+(done.composants?'':'<button class="btn" type="button" id="compOk" style="margin-top:6px">Valider les modules</button>')+
      '<p class="step-note">Chaque module se change ensuite à l’unité, avec son tutoriel. Le châssis, la visserie et le tournevis sont inclus.</p>';}
  else if(s.k==='couleur'){if(m.k==='mesure')b=sw(D.COLORS[c.cmat],c.ccol,'Couleur, '+D.byV('cmat',c.cmat).t.toLowerCase())+'<p class="step-note">Toutes les pièces visibles prennent cette couleur.'+(D.kind==='tablet'?' Le plateau photo reste en noir fumé.':'')+'</p>';
    else b='<p class="col-name">Couleur <span>'+esc(done.couleur?D.finOf(m,curFin())[1]:'À choisir')+'</span></p><div class="swatches" role="radiogroup" aria-label="Couleur">'+m.fins.map(f=>{const on=done.couleur&&f[0]===curFin();
      return '<label class="sw'+(on?' on':'')+'" title="'+esc(f[1])+'">'+radio('fin',f[0],on).replace('>',' aria-label="'+esc(f[1])+'">')+'<span style="--c:'+D.hex(m,f[0])+'"></span></label>';}).join('')+'</div>'+
      '<p class="step-note">'+esc(D.byV('cmat',c.cmat).t+', '+D.byV('cmat',c.cmat).d.toLowerCase()+'. Une seule couleur, sur toutes les pièces visibles.'+(D.kind==='tablet'?' Le plateau photo reste en noir fumé.':''))+'</p>';}
  else if(s.k==='stockage'){const b0=m.k==='mesure'?0:D.priceM(m,caps()[0]);
    b='<div class="choices" role="radiogroup" aria-label="Capacité">'+caps().map(v=>{const on=done.stockage&&v===curCap();let d;
        if(m.k==='mesure'){const t=Object.assign({},c,{cap:v});d=D.to9(D.price(t))-D.to9(D.price(Object.assign({},c,{cap:caps()[0]})));}else d=D.priceM(m,v)-b0;
      return '<label class="choice'+(on?' on':'')+'">'+radio('cap',v,on)+'<span class="c-row"><span class="c-t">'+D.capL(v)+'<small>'+esc(capUse(v))+'</small></span><span class="c-p">'+(d>0?'+ '+money(d):'')+'</span></span></label>';}).join('')+'</div>'+
    (m.k==='mesure'&&D.tier?'<div class="grp" style="margin-top:22px"><p class="col-name">Qualité de la mémoire</p><div class="choices" role="radiogroup">'+window.DEV.TIER.map(o=>'<label class="choice'+(o.v===c.tier?' on':'')+'">'+radio('tier',o.v,o.v===c.tier)+'<span class="c-t">'+esc(o.t)+'<small>'+esc(o.d)+'</small></span></label>').join('')+'</div></div>':'')+
    '<p class="step-note">Le stockage est un module : il se change ou s’agrandit plus tard, sans racheter l’appareil.</p>';}
  else if(s.k==='care'){b='<div class="choices" role="radiogroup" aria-label="Vertane Care">'+
      '<label class="choice'+(care===true?' on':'')+'">'+radio('care','1',care===true)+'<span class="c-row"><span class="c-t">Vertane Care, 2 ans</span><span class="c-p">'+money(CARE.price)+'</span></span><span class="c-d">Casse accidentelle et panne couvertes, module de remplacement expédié en 24 h, batterie changée si elle descend sous 80 %.</span></label>'+
      '<label class="choice'+(care===false?' on':'')+'">'+radio('care','0',care===false)+'<span class="c-t">Sans Vertane Care<small>Garantie légale de 2 ans incluse</small></span></label></div>';}
  return '<section class="step'+(locked?' locked':'')+'" id="'+id+'" data-k="'+s.k+'" aria-labelledby="'+id+'-t"'+(locked?' aria-disabled="true"':'')+'><h2 id="'+id+'-t">'+s.t+' <span>'+s.s+'</span></h2>'+b+'</section>';}

const stepsEl=$('#steps');
function render(){const ul=unlockedIdx(),a=document.activeElement,fk=a&&a.name?[a.name,a.value,a.id]:null,inc=stepsEl.querySelector('.inc'),incOpen=inc&&inc.open;
  stepsEl.innerHTML=steps().map((s,i)=>stepHTML(s,i,ul)).join('');
  if(incOpen&&stepsEl.querySelector('.inc'))stepsEl.querySelector('.inc').open=true;
  if(fk){const el=(fk[2]&&document.getElementById(fk[2]))||stepsEl.querySelector('[name="'+fk[0]+'"][value="'+fk[1]+'"]');if(el)el.focus({preventScroll:true});}
  document.title='Acheter le '+nameOf(m);$('#title').textContent=nameOf(m);$('#toMesure').hidden=m.k==='mesure';$('#toMesure').href='acheter-appareil.html?d='+D.k+'&m=mesure';
  $('#to3d').href='configurateur.html?d='+D.k+(m.k!=='mesure'?'&m='+m.k+(fin?'&c='+fin:''):'');$('#toDisc').href='appareil.html?d='+D.k;$('#toCmp').href='categorie.html?c='+D.k+'#comparer';
  const p=m.k==='mesure'?price():D.from(m);$('#fromPrice').textContent=(m.k==='mesure'?'Ta configuration : ':'À partir de ')+money(p)+' ou '+V.monthly(p)+'/mois sur 12 mois¹';
  gallery();summary();recap();}

function eta(){const d=new Date();let n=0;while(n<5){d.setDate(d.getDate()+1);if(d.getDay()%6)n++;}return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function summary(){const ok=allDone(),left=steps().filter(s=>!isDone(s)).length;
  $('#bbPrice').textContent=money(ok?total():price());
  $('#bbMonthly').textContent=ok?'ou '+V.monthly(total())+'/mois sur 12 mois¹':'Encore '+left+' étape'+(left>1?'s':'')+' à choisir';
  $('#bbShip').innerHTML='<b>Livraison gratuite</b>Livré au plus tard le '+eta();
  $('#bbBtn').textContent=ok?'Ajouter au panier':'Continuer';
  $('#buybar').classList.toggle('on',!!done.modele);}
function lines(){const c=cfg();return [['Couleur',finName()]].concat(hasSto()?[['Stockage',D.capL(c.cap)]]:[],D.specs(c).filter(r=>['Dimensions','Masse'].indexOf(r[0])<0));}
let shotK='',shotU='';
function shot(){const c=cfg();if(!window.D3D)return still();const k=JSON.stringify(D.d3(c));if(k!==shotK){shotK=k;const st=window.D3D.state;window.D3D.anim({e:0,resetLift:true,instant:true});shotU=window.D3D.snapView('hero',900,900,'image/webp',.86,null,.06);window.D3D.anim({e:st.e,instant:true});}return shotU;}
function recap(){const r=$('#recap');if(!allDone()){r.hidden=true;return;}r.hidden=false;const c=cfg(),h=D.hours(c);
  const li='<li><span><b>'+esc(nameOf(m))+'</b><small>'+esc(finName()+(hasSto()?', '+D.capL(c.cap):''))+'</small></span><span>'+money(price())+'</span></li>'+
    (care?'<li><span><b>'+CARE.name+'</b></span><span>'+money(CARE.price)+'</span></li>':'');
  r.innerHTML='<div class="recap-img"><img src="'+shot()+'" alt="Ton '+esc(nameOf(m))+'"></div><div><p class="eyebrow">Récapitulatif</p><h2 class="h2" id="recap-t">Ton '+esc(nameOf(m))+' est prêt.</h2>'+
    '<p class="muted" style="margin:10px 0 0;font-size:15px">'+(h?(D.kind==='headphones'||D.kind==='earbuds'?h+' h d’écoute':D.kind==='speaker'?h+' h sur batterie':String(h).replace('.',',')+' h d’autonomie')+'² · ':'')+esc(D.dims(c))+'</p><ul>'+li+'</ul>'+
    '<div class="tot"><span>Total</span><b>'+money(total())+'</b></div><p class="muted" style="margin:0;text-align:right;font-size:14px">ou '+V.monthly(total())+'/mois sur 12 mois¹</p>'+
    '<div class="ship"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2" fill="#fff"/><circle cx="18" cy="18" r="2" fill="#fff"/></svg><span><b>Livraison gratuite.</b> Livré au plus tard le '+eta()+'. Retours gratuits pendant 30 jours.</span></div>'+
    '<button class="btn btn-lg btn-block" id="addBag">'+(edited?'Mettre à jour le panier':'Ajouter au panier')+'</button></div>';}

/* ---------- interactions ---------- */
function url(){history.replaceState(null,'','?d='+D.k+'&m='+m.k+(fin?'&c='+fin:'')+(cap?'&s='+cap:'')+(editId?'&edit='+editId:''));}
stepsEl.addEventListener('change',e=>{const t=e.target,n=t.name;if(!n)return;
  if(n==='model'){const nm=D.byK(t.value);if(!nm)return;const first=!done.modele;
    if(nm.k==='mesure'&&m.k!=='mesure'){startMesure(cfg());done.composants=false;}
    m=nm;done.modele=true;
    if(fin&&!m.fins.some(f=>f[0]===fin)){fin=null;done.couleur=m.k==='mesure'?done.couleur:false;}if(cap&&caps().indexOf(cap)<0){cap=null;done.stockage=false;}
    url();setView(VW[0][0]);render();if(first||!isDone(steps()[1]))next('modele');return;}
  if(COMP.indexOf(n)>=0){const o=D.OPT[n].find(x=>String(x.v)===t.value);if(!o)return;comp[n]=o.v;const c=cfg();COMP.forEach(k=>comp[k]=c[k]);col=c.ccol;render();return;}
  if(n==='ccol'){col=t.value;const first=!done.couleur;done.couleur=true;render();if(first)next('couleur');return;}
  if(n==='fin'){const first=!done.couleur;fin=t.value;done.couleur=true;url();render();if(first)next('couleur');return;}
  if(n==='cap'){const first=!done.stockage;cap=+t.value;done.stockage=true;url();render();if(first)next('stockage');return;}
  if(n==='tier'){comp.tier=t.value;render();return;}
  if(n==='care'){care=t.value==='1';render();return;}});
function next(k){const S=steps(),i=S.findIndex(s=>s.k===k),n=S.slice(i+1).find(s=>!isDone(s));if(!n)return;setTimeout(()=>{const el=document.getElementById('etape-'+n.k);if(el&&el.getBoundingClientRect().top>innerHeight*.55)el.scrollIntoView({behavior:V.reduce?'auto':'smooth',block:'start'});},250);}
function goStep(k){const el=document.getElementById('etape-'+k);if(el)el.scrollIntoView({behavior:V.reduce?'auto':'smooth',block:'start'});}
stepsEl.addEventListener('click',e=>{
  if(e.target.id==='toCustom'){const c=cfg();startMesure(c);cap=c.cap||null;m=D.MESURE;fin=null;done.composants=false;done.couleur=true;url();render();goStep('composants');}
  if(e.target.id==='compOk'){done.composants=true;render();next('composants');}});
$('#bbBtn').addEventListener('click',()=>{if(allDone())add();else goStep(steps().find(x=>!isDone(x)).k);});
document.addEventListener('click',e=>{if(e.target.id==='addBag')add();});

function add(){if(!allDone())return;const c=cfg(),mesure=m.k==='mesure',code=D.gen.toUpperCase();
  const item={type:'device',fam:D.k,model:m.k,fin:mesure?c.cmat+'-'+c.ccol:curFin(),cap:hasSto()?c.cap:null,
    sku:code+'-'+m.k.toUpperCase()+'-'+(mesure?COMP.map(k=>String(c[k]).slice(0,3).toUpperCase()).join('')+'-'+c.ccol.toUpperCase():curFin().toUpperCase())+(hasSto()?'-'+c.cap:''),
    name:nameOf(m),cfg:c,img:shot(),lines:lines(),price:price(),care:care?{name:CARE.name,price:CARE.price}:null,trade:null,
    specs:finName()+(hasSto()?' · '+D.capL(c.cap):'')};
  if(edited){item.qty=edited.qty;V.Bag.remove(edited.id);}
  const id=V.Bag.add(item);location.href='panier.html?ajout='+encodeURIComponent(id);}

render();
})();
</script>
<script src="assets/walls.js"></script>
<script src="assets/devices-3d.js"></script>
<script src="assets/devices-models.js"></script>
<script>
(async function(){const touch=matchMedia('(pointer:coarse)').matches;
try{const v=await window.mountDevice(document.getElementById('v3d'),{interactive:!touch,noZoom:true,reduce:window.V.reduce});v.touch=touch;window.D3D=v;window.dispatchEvent(new Event('dev-3d'));}
catch(e){console.warn('3D indisponible, rendu fixe affiché',e);}})();
</script>
