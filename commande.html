<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paiement — Vertane</title>
<meta name="theme-color" content="#F3F1EA">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/vertane-favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo/vertane-apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vertane.css">
<style>
body[data-minimal] .gnav-links,body[data-minimal] #searchBtn{display:none}
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(28px,5vw,72px);align-items:start;padding-top:120px;padding-bottom:100px}
.co h1{margin-bottom:10px}
.co-sub{margin:0 0 32px;color:var(--pierre)}
.stepper{display:flex;gap:6px;list-style:none;margin:0 0 36px;padding:0;font-size:13.5px;color:var(--pierre);flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:6px}
.stepper li+li::before{content:"";width:18px;height:1px;background:var(--lin);margin-right:6px}
.stepper li.on{color:var(--noir);font-weight:600}
.stepper li.ok{color:var(--vert)}
.blk{border-top:1px solid var(--lin);padding:28px 0}
.blk h2{font:500 22px/1.25 var(--display);letter-spacing:-.015em;margin:0 0 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.blk h2 button{border:0;background:none;padding:0;font:400 15px var(--text);color:var(--vert)}
.blk .done{font-size:15px;color:var(--pierre);margin:0}
.blk .done b{color:var(--noir);font-weight:600}
.blk.off h2{color:var(--pierre);margin:0}
.grp{margin:26px 0 12px;font:600 15px/1.3 var(--text)}
.opts{display:grid;gap:12px}
.demo{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-s);background:rgba(47,122,85,.08);font-size:14px;color:var(--noir);margin:18px 0 0}
.demo svg{width:20px;height:20px;flex:0 0 auto;color:var(--vert)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;margin:18px 0 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--vert);margin:1px 0 0;flex:0 0 auto}
.chk.err{color:var(--danger)}
.next{margin-top:28px}
.cards-ic{display:flex;gap:6px;margin-left:auto}
.cards-ic span{font:600 10px/1 var(--text);letter-spacing:.04em;padding:5px 6px;border-radius:5px;background:var(--ivoire);color:var(--pierre)}
.review dl{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;margin:0;font-size:15px}
.review dt{color:var(--pierre)}
.review dd{margin:0}

.side{position:sticky;top:96px;background:var(--blanc);border-radius:var(--r-l);padding:28px}
.side h2{font:500 19px/1.3 var(--display);margin:0 0 18px;letter-spacing:-.015em}
.side ul{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:14px}
.side li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;font-size:14px}
.side li img{width:56px;height:56px;object-fit:contain;background:var(--ivoire);border-radius:12px;padding:4px}
.side li small{display:block;color:var(--pierre)}
.side .row{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.side .row.minus span:last-child{color:var(--vert)}
.side .total{border-top:1px solid var(--lin-2);margin-top:10px;padding-top:14px;font:500 20px/1.2 var(--display)}
.side .mo{font-size:13px;color:var(--pierre);text-align:right;margin:4px 0 0}
.side-toggle{display:none}
@media (max-width:900px){
  .co{grid-template-columns:1fr;padding-top:100px}
  .side{position:relative;top:0;order:-1;padding:0;background:transparent}
  .side-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:var(--blanc);border-radius:var(--r-m);padding:16px 18px;font-size:15px;color:var(--vert)}
  .side-toggle b{color:var(--noir);font-weight:600}
  .side-in{display:none;background:var(--blanc);border-radius:var(--r-m);padding:20px;margin-top:8px}
  .side.open .side-in{display:block}
}

/* confirmation */
.thanks{padding:150px 0 120px;text-align:center}
.thanks .ok{width:72px;height:72px;margin:0 auto 26px;border-radius:50%;background:var(--vert);color:var(--ivoire);display:grid;place-items:center;animation:pop .7s var(--ease-out)}
.thanks .ok svg{width:34px;height:34px}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.thanks .lead{max-width:560px;margin:18px auto 0}
.order{max-width:640px;margin:48px auto 0;text-align:left;background:var(--blanc);border-radius:var(--r-l);padding:32px}
.order dl{display:grid;grid-template-columns:170px 1fr;gap:12px 20px;margin:0 0 20px;font-size:15px}
.order dt{color:var(--pierre)}
.order dd{margin:0}
.timeline{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12.5px;color:var(--pierre);text-align:center}
.timeline li{position:relative;padding-top:22px}
.timeline li::before{content:"";position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--lin)}
.timeline li.on{color:var(--noir);font-weight:600}
.timeline li.on::before{background:var(--vert);box-shadow:0 0 0 4px rgba(47,122,85,.18)}
</style>
</head>
<body data-page="commande" data-minimal>
<script src="assets/site.js"></script>
<main id="main"><div class="shell" id="root"></div></main>
<template id="foot-notes"><p>Paiement sécurisé. Prix TTC. Paiement en 12 fois sans frais sous réserve d’acceptation. Retours gratuits pendant 30 jours.</p></template>
<script src="assets/m1-data.js"></script>
<script>
(function(){
"use strict";
const V=window.V,B=V.Bag,$=s=>document.querySelector(s),esc=V.esc,money=V.money,root=$('#root');
const LOCK='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="12" height="8" rx="2"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function biz(n){const d=new Date();let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()%6)k++;}return d;}
const fmtD=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const SHIP={std:{t:'Livraison standard',p:0,d:5},exp:{t:'Livraison express',p:9.9,d:2}};
let step=0,f={prenom:'',nom:'',adr:'',adr2:'',cp:'',ville:'',email:'',tel:'',ship:'std',pay:'card',last4:'',cgv:false};

/* ---------- confirmation ---------- */
const done=V.store.get('vertane-last-order',null);
if(new URLSearchParams(location.search).get('merci')&&done){thanks(done);return;}
if(!B.items().length){root.innerHTML='<div class="thanks"><h1 class="h1">Ton panier est vide.</h1><p class="lead">Ajoute un Vertane ou un module avant de passer au paiement.</p><div class="ctas" style="margin-top:28px"><a class="btn btn-lg" href="store.html">Aller au Store</a><a class="link" href="modules.html">Voir les modules</a></div></div>';return;}

function totals(){const a=B.items(),sub=a.reduce((s,x)=>s+(x.price+(x.care?x.care.price:0))*x.qty,0),tr=a.reduce((s,x)=>s+(x.trade?x.trade.value:0),0),sh=SHIP[f.ship].p;return {sub,tr,sh,tot:sub-tr+sh};}
function side(){const a=B.items(),t=totals();
  return '<aside class="side" id="side"><button class="side-toggle" id="sideT" aria-expanded="false"><span>Afficher le récapitulatif</span><b>'+money(t.tot)+'</b></button><div class="side-in"><h2>Ta commande</h2><ul>'+
    a.map(x=>'<li><img src="'+esc(x.img)+'" alt=""><span>'+esc(x.name)+(x.qty>1?' × '+x.qty:'')+(x.care?'<small>+ '+esc(x.care.name)+'</small>':'')+'</span><span>'+money((x.price+(x.care?x.care.price:0))*x.qty)+'</span></li>').join('')+'</ul>'+
    '<div class="row"><span>Sous-total</span><span>'+money(t.sub)+'</span></div>'+(t.tr?'<div class="row minus"><span>Reprise estimée</span><span>− '+money(t.tr)+'</span></div>':'')+
    '<div class="row"><span>'+SHIP[f.ship].t+'</span><span>'+(t.sh?money(t.sh):'Gratuite')+'</span></div><div class="row total"><span>Total</span><span>'+money(t.tot)+'</span></div><p class="mo">dont TVA '+money(t.tot-t.tot/1.2)+'</p>'+
    '<p style="margin:16px 0 0;font-size:14px"><a href="panier.html">Modifier le panier</a></p></div></aside>';}
function fld(n,label,type,opt){opt=opt||{};return '<div class="field'+(opt.full?' full':'')+'"><input id="f-'+n+'" name="'+n+'" type="'+(type||'text')+'" placeholder=" " value="'+esc(f[n]||'')+'"'+(opt.ac?' autocomplete="'+opt.ac+'"':'')+(opt.im?' inputmode="'+opt.im+'"':'')+(opt.max?' maxlength="'+opt.max+'"':'')+'><label for="f-'+n+'">'+label+'</label><p class="msg" id="m-'+n+'"></p></div>';}
const STEPS=['Livraison','Paiement','Vérification'];
function render(){
  const s1=step===0?'<div class="blk"><h2>Où doit-on livrer ta commande ?</h2><div class="form-grid">'+fld('prenom','Prénom','text',{ac:'given-name'})+fld('nom','Nom','text',{ac:'family-name'})+fld('adr','Adresse','text',{full:1,ac:'address-line1'})+fld('adr2','Appartement, bâtiment (facultatif)','text',{full:1,ac:'address-line2'})+fld('cp','Code postal','text',{ac:'postal-code',im:'numeric',max:5})+fld('ville','Ville','text',{ac:'address-level2'})+'</div>'+
      '<p class="grp">Tes coordonnées</p><div class="form-grid">'+fld('email','E-mail','email',{ac:'email'})+fld('tel','Téléphone','tel',{ac:'tel',im:'tel'})+'</div><p class="fine" style="margin-top:8px">Pour le suivi de livraison uniquement.</p>'+
      '<p class="grp">Mode de livraison</p><div class="opts">'+Object.keys(SHIP).map(k=>'<label class="choice'+(f.ship===k?' on':'')+'"><input type="radio" name="ship" value="'+k+'"'+(f.ship===k?' checked':'')+'><span class="c-row"><span class="c-t">'+SHIP[k].t+'<small>Livré le '+fmtD(biz(SHIP[k].d))+'</small></span><span class="c-p">'+(SHIP[k].p?money(SHIP[k].p):'Gratuite')+'</span></span></label>').join('')+'</div>'+
      '<button class="btn btn-lg next" data-go="1">Continuer vers le paiement</button></div>'
    :'<div class="blk"><h2>Livraison <button data-edit="0">Modifier</button></h2><p class="done"><b>'+esc(f.prenom+' '+f.nom)+'</b><br>'+esc(f.adr+(f.adr2?', '+f.adr2:''))+', '+esc(f.cp+' '+f.ville)+'<br>'+SHIP[f.ship].t+', livré le '+fmtD(biz(SHIP[f.ship].d))+'</p></div>';
  const s2=step<1?'<div class="blk off"><h2>Paiement</h2></div>':step===1?'<div class="blk"><h2>Comment veux-tu payer ?</h2><div class="opts">'+
      [['card','Carte bancaire','<span class="cards-ic"><span>CB</span><span>VISA</span><span>MC</span></span>'],['x12','Paiement en 12 fois sans frais','<span class="c-p">'+V.monthly(totals().tot)+'/mois</span>'],['paypal','PayPal','']].map(o=>'<label class="choice'+(f.pay===o[0]?' on':'')+'"><input type="radio" name="pay" value="'+o[0]+'"'+(f.pay===o[0]?' checked':'')+'><span class="c-row"><span class="c-t">'+o[1]+'</span>'+o[2]+'</span></label>').join('')+'</div>'+
      (f.pay==='card'||f.pay==='x12'?'<div class="form-grid" style="margin-top:18px">'+fld('cc','Numéro de carte','text',{full:1,ac:'cc-number',im:'numeric',max:23})+fld('exp','Expiration (MM/AA)','text',{ac:'cc-exp',im:'numeric',max:5})+fld('cvc','Cryptogramme','text',{ac:'cc-csc',im:'numeric',max:4})+fld('titulaire','Nom sur la carte','text',{full:1,ac:'cc-name'})+'</div>':'<p class="step-note" style="margin-top:16px;color:var(--pierre)">Tu seras redirigé vers PayPal pour valider le paiement.</p>')+
      '<p class="demo">'+LOCK+'<span>Site de démonstration : aucun paiement n’est effectué et aucune donnée ne quitte ton navigateur. Le numéro de carte n’est jamais enregistré.</span></p>'+
      '<button class="btn btn-lg next" data-go="2">Vérifier la commande</button></div>'
    :'<div class="blk"><h2>Paiement <button data-edit="1">Modifier</button></h2><p class="done"><b>'+(f.pay==='paypal'?'PayPal':f.pay==='x12'?'12 fois sans frais, carte •••• '+esc(f.last4):'Carte •••• '+esc(f.last4))+'</b></p></div>';
  const t=totals();
  const s3=step<2?'<div class="blk off"><h2>Vérification</h2></div>':'<div class="blk review"><h2>Vérifie ta commande</h2><dl><dt>Livraison</dt><dd>'+esc(f.prenom+' '+f.nom)+', '+esc(f.adr)+', '+esc(f.cp+' '+f.ville)+'</dd><dt>Contact</dt><dd>'+esc(f.email)+' · '+esc(f.tel)+'</dd><dt>Arrivée</dt><dd>'+fmtD(biz(SHIP[f.ship].d))+'</dd><dt>Total</dt><dd><b>'+money(t.tot)+'</b>'+(f.pay==='x12'?' en 12 fois de '+V.monthly(t.tot):'')+'</dd></dl>'+
      '<label class="chk" id="cgvL"><input type="checkbox" id="cgv"'+(f.cgv?' checked':'')+'><span>J’accepte les <a href="#">conditions générales de vente</a> et la <a href="#">politique de confidentialité</a>.</span></label>'+
      '<button class="btn btn-lg next" id="place">Passer la commande</button></div>';
  const a=document.activeElement,fid=a&&a.id;
  root.innerHTML='<div class="co"><div><h1 class="h2">Paiement</h1><p class="co-sub">Livraison gratuite et retours gratuits pendant 30 jours.</p><ol class="stepper">'+STEPS.map((x,i)=>'<li class="'+(i===step?'on':i<step?'ok':'')+'">'+(i<step?'✓ ':'')+x+'</li>').join('')+'</ol>'+s1+s2+s3+'</div>'+side()+'</div>';
  if(fid&&document.getElementById(fid))document.getElementById(fid).focus();}

/* ---------- validation ---------- */
function err(n,msg){const el=document.getElementById('f-'+n);if(!el)return false;el.parentNode.classList.toggle('err',!!msg);$('#m-'+n).textContent=msg||'';if(msg)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid');return !msg;}
const luhn=n=>{let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9;}s+=d;alt=!alt;}return s%10===0;};
function check(n,v){v=(v||'').trim();switch(n){
  case 'prenom':case 'nom':case 'ville':return v?'':'Champ obligatoire.';
  case 'adr':return v.length>4?'':'Indique ton adresse complète.';
  case 'cp':return /^\d{5}$/.test(v)?'':'Code postal à 5 chiffres.';
  case 'email':return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?'':'Adresse e-mail invalide.';
  case 'tel':return /^(\+33|0)[1-9](\d{2}){4}$/.test(v.replace(/[\s.-]/g,''))?'':'Numéro de téléphone invalide.';
  case 'cc':{const d=v.replace(/\s/g,'');return /^\d{13,19}$/.test(d)&&luhn(d)?'':'Numéro de carte invalide.';}
  case 'exp':{const m=/^(\d{2})\/(\d{2})$/.exec(v);if(!m||+m[1]<1||+m[1]>12)return 'Format MM/AA.';const e=new Date(2000+ +m[2],+m[1],1);return e>new Date()?'':'Carte expirée.';}
  case 'cvc':return /^\d{3,4}$/.test(v)?'':'3 ou 4 chiffres.';
  case 'titulaire':return v?'':'Champ obligatoire.';}return '';}
function validate(names){let ok=true,first=null;names.forEach(n=>{const el=document.getElementById('f-'+n);const m=check(n,el?el.value:'');if(!err(n,m)){ok=false;if(!first)first=el;}});if(first)first.focus();return ok;}

root.addEventListener('input',e=>{const t=e.target;
  if(t.name==='cc'){const d=t.value.replace(/\D/g,'').slice(0,19);t.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');}
  if(t.name==='exp'){let d=t.value.replace(/\D/g,'').slice(0,4);if(d.length>2)d=d.slice(0,2)+'/'+d.slice(2);t.value=d;}
  if(t.name==='cvc'||t.name==='cp')t.value=t.value.replace(/\D/g,'');
  if(t.name&&t.name in f&&['cc','exp','cvc'].indexOf(t.name)<0)f[t.name]=t.value;
  if(t.parentNode.classList.contains('err'))err(t.name,check(t.name,t.value));});
root.addEventListener('focusout',e=>{const t=e.target;if(t.name&&t.value)err(t.name,check(t.name,t.value));});
root.addEventListener('change',e=>{const t=e.target;if(t.name==='ship'){f.ship=t.value;keep(()=>render());}if(t.name==='pay'){f.pay=t.value;keep(()=>render());}if(t.id==='cgv'){f.cgv=t.checked;$('#cgvL').classList.remove('err');}});
function keep(fn){const vals={};root.querySelectorAll('input[name]').forEach(i=>{if(i.type!=='radio'&&i.type!=='checkbox')vals[i.name]=i.value;});fn();Object.keys(vals).forEach(n=>{const i=root.querySelector('input[name="'+n+'"]');if(i&&!i.value)i.value=vals[n];});}
root.addEventListener('click',e=>{const t=e.target;
  if(t.id==='sideT'){const s=$('#side');s.classList.toggle('open');t.setAttribute('aria-expanded',s.classList.contains('open'));return;}
  const ed=t.closest('[data-edit]');if(ed){step=+ed.dataset.edit;render();window.scrollTo({top:0,behavior:V.reduce?'auto':'smooth'});return;}
  const g=t.closest('[data-go]');if(g){
    if(step===0&&!validate(['prenom','nom','adr','cp','ville','email','tel']))return;
    if(step===1&&f.pay!=='paypal'){if(!validate(['cc','exp','cvc','titulaire']))return;f.last4=$('#f-cc').value.replace(/\s/g,'').slice(-4);}
    step=+g.dataset.go;render();const b=root.querySelectorAll('.blk')[step];if(b)b.scrollIntoView({behavior:V.reduce?'auto':'smooth',block:'start'});return;}
  if(t.id==='place'){if(!f.cgv){$('#cgvL').classList.add('err');V.toast('Accepte les conditions de vente pour continuer.');return;}
    t.disabled=true;t.textContent='Commande en cours…';
    setTimeout(()=>{const tt=totals(),n='V-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000);
      const o={n,date:new Date().toISOString(),prenom:f.prenom,ville:f.ville,cp:f.cp,ship:f.ship,arr:biz(SHIP[f.ship].d).toISOString(),total:tt.tot,pay:f.pay,items:B.items().map(x=>({name:x.name,qty:x.qty,img:x.img&&x.img.length<400?x.img:''}))};
      V.store.set('vertane-last-order',o);B.clear();history.replaceState(null,'','commande.html?merci=1');thanks(o);window.scrollTo(0,0);},900);}});

function thanks(o){root.innerHTML='<div class="thanks"><div class="ok">'+CHECK+'</div><p class="eyebrow">Commande '+esc(o.n)+'</p><h1 class="h1">Merci, '+esc(o.prenom||'à toi')+'.</h1><p class="lead">Ta commande est confirmée. On prépare ton colis avec soin, dans un emballage sans plastique.</p>'+
  '<div class="order"><dl><dt>Numéro</dt><dd>'+esc(o.n)+'</dd><dt>Livraison prévue</dt><dd>'+fmtD(new Date(o.arr))+'</dd><dt>Adresse</dt><dd>'+esc(o.cp+' '+o.ville)+'</dd><dt>Total payé</dt><dd><b>'+money(o.total)+'</b></dd><dt>Articles</dt><dd>'+o.items.map(i=>esc(i.name)+(i.qty>1?' × '+i.qty:'')).join('<br>')+'</dd></dl>'+
  '<ol class="timeline"><li class="on">Confirmée</li><li>En préparation</li><li>Expédiée</li><li>Livrée</li></ol></div>'+
  '<div class="ctas" style="margin-top:36px"><a class="btn btn-lg" href="index.html">Retour à l’accueil</a><a class="link" href="reparer.html">Découvrir comment réparer ton M1</a></div></div>';}
render();
})();
</script>
</body>
</html>
