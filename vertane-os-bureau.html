body{background:#000}
.pc{position:fixed;inset:0;overflow:hidden;--R:10px;color:var(--ink);font-size:14px;user-select:none;-webkit-user-select:none}
.pc .wall{position:absolute;inset:0}
.bar{position:absolute;left:0;right:0;top:0;height:34px;z-index:50;display:flex;align-items:center;gap:4px;padding:0 10px;color:#fff;font:500 13.5px/1 var(--font);background:rgba(20,22,24,.28);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 -.5px 0 rgba(255,255,255,.14)}
.bar button{height:26px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:7px;color:#fff;font:inherit}
.bar button:hover,.bar button.on{background:rgba(255,255,255,.16)}
.bar .vl{width:18px;height:18px;color:#fff}
.bar .ttl{font-weight:700}
.bar .menu{opacity:.85;font-weight:400}
.bar .sp{flex:1}
.bar svg{width:15px;height:15px}
.bar .bt{display:flex;align-items:center;gap:6px}
.bar .bt i{position:relative;width:24px;height:11px;border-radius:3px;border:1.2px solid #fff;padding:1px;display:block}
.bar .bt i b{display:block;height:100%;background:#fff;border-radius:1.5px}
.bar .bt i.chg b{background:#34C46A}
.bar .bt i.low b{background:#E5484D}

.pcap{position:absolute;z-index:60;top:0;left:50%;transform:translateX(-50%);background:#000;color:#fff;border-radius:0 0 16px 16px;height:0;width:120px;overflow:hidden;transition:width .55s var(--spring),height .55s var(--spring),border-radius .5s var(--spring),box-shadow .4s;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:600 13px/1 var(--font);cursor:pointer;white-space:nowrap}
.pcap.on{height:34px}
.pcap.big{height:108px;border-radius:0 0 26px 26px;box-shadow:0 20px 40px rgba(0,0,0,.35);align-items:flex-start;padding-top:14px;cursor:default}
.pcap .l,.pcap .r{display:flex;align-items:center;gap:8px}
.pcap svg{width:16px;height:16px}
.desk{position:absolute;left:0;right:0;top:34px;bottom:0;z-index:10}
.dico{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;color:#fff;font:500 12px/1.25 var(--font);text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.45);padding:8px 4px;border-radius:12px}
.dico:hover{background:rgba(255,255,255,.12)}
.dico .ico{width:52px;height:52px}
/* fenêtres */
.w{position:absolute;border-radius:14px;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:360px;min-height:240px;transition:box-shadow .2s}
.w.focus{box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.3)}
.w.max{border-radius:0}
.w.opening{animation:wopen .38s var(--out)}
@keyframes wopen{from{transform:scale(.92);opacity:0}}
.wt{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;background:color-mix(in srgb,var(--bg) 75%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);cursor:default}
.wt .ico{width:20px;height:20px;border-radius:5px;box-shadow:none}
.wt b{font:600 13.5px/1 var(--font);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt button{width:34px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.wt button:hover{background:var(--fill)}
.wt button.x:hover{background:#E5484D;color:#fff}
.wt svg{width:14px;height:14px}
.wb{flex:1;overflow:auto;position:relative}
.wr{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3}
.side{display:grid;grid-template-columns:210px 1fr;height:100%}
.side nav{padding:12px 8px;background:color-mix(in srgb,var(--card) 55%,transparent);border-right:.5px solid var(--sep);overflow:auto}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font:500 13.5px/1.2 var(--font);color:var(--ink);text-align:left}
.side nav button.on{background:var(--accent);color:#fff}
.side nav button svg{width:16px;height:16px;opacity:.85}
.side nav h4{margin:14px 10px 6px;font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.side main{overflow:auto;padding:22px 26px 30px}
.pc .lt{font-size:28px}
.pc .row{min-height:42px;font-size:14.5px}
.pc .grp,.pc .card{border-radius:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.kv div{background:var(--card);border-radius:12px;padding:12px 14px}
.kv small{display:block;color:var(--ink-2);font-size:12px;font-weight:600}
.kv b{display:block;font:700 18px/1.3 var(--font);margin-top:3px}
/* Dock */
.dock2{position:absolute;z-index:40;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-radius:24px}
.dock2 button{position:relative;width:50px;height:50px;transition:transform .25s var(--spring)}
.dock2 button:hover{transform:translateY(-6px) scale(1.12)}
.dock2 .ico{width:50px;height:50px}
.dock2 i{position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;opacity:.9}
.dock2 .sep{width:1px;height:40px;background:rgba(255,255,255,.35);align-self:center}

.launch.on{opacity:1;pointer-events:auto}
.launch .sfield{width:420px}
.lgrid{display:grid;grid-template-columns:repeat(6,110px);gap:24px 20px;margin-top:40px}
.lgrid button{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font:500 13px/1.2 var(--font);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.lgrid .ico{width:72px;height:72px}

.pan{position:absolute;z-index:65;top:42px;right:10px;width:340px;border-radius:22px;padding:14px;color:#fff;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .3s var(--spring)}
.pan.on{opacity:1;transform:none;pointer-events:auto}
.qsg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qs{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;text-align:left;font:600 13px/1.2 var(--font)}

.qs svg{width:16px;height:16px}
.qs small{display:block;font-weight:400;opacity:.7;font-size:11.5px;margin-top:2px}
.sl{margin-top:12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}

.ntc b{font:600 13.5px/1.2 var(--font)}
.ntc span{font-size:13px;opacity:.85}
.toasts{position:absolute;z-index:66;top:44px;right:12px;width:340px;display:flex;flex-direction:column;gap:8px}
.toasts .ntc{animation:tin .45s var(--spring);color:#fff}

.plock .clk{font:300 110px/1 var(--display);letter-spacing:-.04em}
.plock .dt{font:500 20px/1.2 var(--font);opacity:.9;margin-bottom:6px}
.plock .who{margin-top:120px;display:flex;flex-direction:column;align-items:center;gap:10px}
.plock .av{width:76px;height:76px;border-radius:50%;background:linear-gradient(160deg,#8DB89A,#2F7A55);display:grid;place-items:center}
.plock .av svg{width:38px;height:38px}
.plock p{margin:0;font-size:13px;opacity:.75}

.term{background:#0d1117;color:#c9d1d9;font:400 13px/1.55 "JetBrains Mono",ui-monospace,monospace;padding:14px 16px;height:100%;overflow:auto;user-select:text;-webkit-user-select:text}
.term .p{color:#8DB89A}
.term input{background:none;border:0;outline:0;color:#c9d1d9;font:inherit;width:70%}

.aibar.on{opacity:1;transform:none;pointer-events:auto}
.aibar .ai-row{padding:4px}
.aibar .ai-in{height:48px;font-size:17px}
.aibar .ans{padding:12px 14px 6px;font-size:15px;line-height:1.5}
.aiglow{position:absolute;inset:0;z-index:79;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 40px 6px rgba(120,170,255,.45),inset 0 0 90px 10px rgba(141,184,154,.35)}
.aiglow.on{opacity:1}
.boot2{position:absolute;inset:0;z-index:95;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#fff}
.boot2.on{display:flex}
.boot2 img{width:90px;height:90px}
.boot2 .bar3{width:200px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.boot2 .bar3 i{display:block;height:100%;width:0;background:#fff;transition:width 1.8s ease}
.off2{position:absolute;inset:0;z-index:96;background:#000;display:none}
.off2.on{display:block}
.expo .w{transition:transform .45s var(--out)!important}
</style>

function health(){const c=DS.cfg,u=DS.usage,p=k=>DS.parts[k]||{};const bh=clamp(100-(u.cycles-(p('batt').cy||0))*.02-(u.days-(p('batt').d||0))*.003,55,100);
  const end=c.sto*600/1000,ssd=clamp(100-(u.tbw-(p('sto').tb||0))/end*100,0,100),fan=clamp(100-(u.fanH-(p('board').fh||0))/120,40,100),kb=clamp(100-(u.keys-(p('kb').k||0))*1.4,50,100),scr=clamp(100-(u.scrH-(p('screen').sh||0))/(c.screen==='oled'?600:1200),60,100);
  return [{k:'batt',t:'Batterie',ic:'batt',pct:bh,s:[['Capacité',String(size().batt).replace('.',',')+' Wh'],['Santé',Math.round(bh)+' %'],['Cycles',u.cycles-(p('batt').cy||0)]]},
    {k:'screen',t:'Écran',ic:'screen',pct:scr,s:[['Dalle',B.byV(B.SCREENS,c.screen).t],['Heures allumé',u.scrH+' h']]},
    {k:'board',t:'Carte mère et ventilateur',ic:'fan',pct:fan,s:[['Puce',B.byV(B.BOARDS,c.board).t],['Ventilateur',Math.round(u.fanH-(p('board').fh||0))+' h'],['Poussière',fan<85?'Nettoyage conseillé':'Faible']]},
    {k:'ram',t:'Mémoire LPCAMM2',ic:'ram',pct:100,s:[['Capacité',c.ram+' Go'],['Erreurs','0']]},
    {k:'sto',t:'SSD M.2',ic:'disk',pct:ssd,s:[['Capacité',B.capL(c.sto)],['Écrit',Math.round(u.tbw-(p('sto').tb||0))+' To sur '+Math.round(end)+' To']]},
    {k:'kb',t:'Clavier et pavé tactile',ic:'kb',pct:kb,s:[['Frappes',(u.keys-(p('kb').k||0)).toFixed(1).replace('.',',')+' millions'],['Touches usées','Aucune']]}];}
function analyze(){const c=DS.cfg,it=[],s=size(),h=B.hours(c),n={};c.ports.forEach(p=>n[p]=(n[p]||0)+1);const half=c.ports.length/2,L=c.ports.slice(0,half).includes('spk'),R=c.ports.slice(half).includes('spk');
  if(c.board==='g'&&c.ram<32)it.push({sev:'warn',t:'Mémoire trop juste pour la carte graphique',b:'Avec la graphique dédiée, 16 Go se remplissent vite en 3D : Vertane OS utilise alors le SSD, bien plus lent. Passe à 32 Go.'});
  if(c.ram===64&&c.board==='e')it.push({sev:'tip',t:'Mémoire surdimensionnée pour la puce',b:'La puce 8 cœurs n’exploite pas 64 Go. 32 Go suffisent, la différence pourrait aller dans un SSD plus grand.'});
  if((c.board==='x'||c.board==='g')&&c.screen==='ips')it.push({sev:'tip',t:'L’écran bride ta puce',b:'Ta puce 16 cœurs peut afficher bien plus que 60 Hz. Un écran 120 Hz rendrait tout plus fluide.'});
  if(h<10)it.push({sev:'warn',t:'Batterie trop petite pour ton écran et ta puce',b:'Environ '+h+' h d’autonomie. Baisse la fréquence de l’écran, ou choisis un châssis plus grand pour une batterie plus grosse.'});
  if(n.cache)it.push({sev:'tip',t:(n.cache>1?n.cache+' baies vides':'Une baie vide'),b:'Elles sont fermées par des caches. Tu peux y clipser un lecteur SD, un port Ethernet ou un haut-parleur de plus, sans outil.'});
  if(!(L&&R))it.push({sev:'tip',t:L||R?'Son mono':'Aucun haut-parleur',b:'Ajoute une carte haut-parleur de l’autre côté pour la stéréo.'});
  if(c.sto<=512&&c.board==='g')it.push({sev:'tip',t:'SSD un peu petit pour le jeu',b:'Les jeux récents pèsent 100 Go et plus. Un SSD de 1 To se change en 5 minutes.'});
  health().forEach(x=>{if(x.pct<80)it.push({sev:'warn',t:x.t+' en fin de vie',b:'Niveau de vie : '+Math.round(x.pct)+' %. Il se change en quelques minutes.'});else if(x.k==='board'&&x.pct<85)it.push({sev:'tip',t:'Ventilateur à dépoussiérer',b:'Il tourne plus vite pour refroidir : un nettoyage le rendra plus silencieux.'});});
  const w=it.filter(i=>i.sev==='warn').length,t=it.filter(i=>i.sev==='tip').length;if(!w)it.push({sev:'ok',t:'Puce et écran bien assortis',b:'Ta puce exploite ton écran '+B.byV(B.SCREENS,c.screen).t+'.'});
  return {it,score:clamp(100-w*14-t*5,20,100),h};}

function expose(){const ws=Object.values(W).filter(w=>!w.min);if(!ws.length)return;const on=!root.classList.contains('expo');root.classList.toggle('expo',on);
  const n=ws.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),cw=innerWidth/cols,ch=(innerHeight-120)/rows;
  ws.forEach((w,i)=>{if(!on){w.el.style.transform='';return;}const c=i%cols,r2=Math.floor(i/cols),k=Math.min(.9*cw/w.el.offsetWidth,.85*ch/w.el.offsetHeight,.8);
    const tx=c*cw+cw/2-(w.el.offsetLeft+w.el.offsetWidth/2),ty=r2*ch+ch/2+10-(w.el.offsetTop+w.el.offsetHeight/2);w.el.style.transformOrigin='center';w.el.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';

function answer(q){const n=q.toLowerCase(),an=analyze(),c=DS.cfg;
  if(/batter|autonomie/.test(n))return 'Batterie à '+DS.batt+' %, environ '+Math.round(an.h*DS.batt/100)+' h. Santé : '+Math.round(health()[0].pct)+' %.';
  if(/optimis|amélior|ameliore|conseil/.test(n))return an.it.filter(i=>i.sev!=='ok').slice(0,2).map(i=>i.t+' : '+i.b).join(' ')||'Ton '+model.name+' est bien équilibré ('+an.score+'/100).';
  if(/port|baie/.test(n))return 'Tes baies : '+B.portsSum(c)+'. La baie 1 reste l’USB-C de charge.';
  if(/mémoire|memoire|ram/.test(n))return c.ram+' Go de LPCAMM2, un seul module vissé à plat : 5 minutes pour le changer.';
  if(/minuteur/.test(n)){timer(300);return 'Minuteur de 5 minutes lancé : il s’affiche dans la Capsule, sous la caméra.';}
  return 'En démonstration, je réponds sur la batterie, les baies, la mémoire, les optimisations et les minuteurs.';}
function ai(on,text){$('#aibar').classList.toggle('on',on);$('#aiglow').classList.toggle('on',on);if(!on)return;
  $('#aibar').innerHTML='<div class="ai-row"><span class="aiglyph">'+S(G.spark)+'</span><input class="ai-in" id="aiq" placeholder="Demande à Vertane…"></div><div class="ans" id="aia"></div>';const i=$('#aiq');setTimeout(()=>i.focus(),60);
  const go=q=>{$('#aia').textContent=answer(q);};i.addEventListener('keydown',e=>{if(e.key==='Enter'&&i.value.trim())go(i.value.trim());if(e.key==='Escape')ai(false);});if(text){i.value=text;go(text);}}

function renderLock(){const d=new Date();$('#plock').innerHTML='<div class="wall" style="background:'+wall+';filter:blur(8px) brightness(.85);transform:scale(1.05)"></div><div style="position:relative;text-align:center"><div class="dt">'+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</div><div class="clk">'+hm(d)+'</div></div><div class="who" style="position:relative"><div class="av">'+S(G.person,1.6)+'</div><b>Compte Vertane</b><p>Touche l’écran ou appuie sur une touche</p></div>';}

function catalog(){const s=size();return [
  {k:'screen',t:'Écran complet',fields:[{f:'screen',t:'Dalle',opts:B.SCREENS.filter(x=>x.sizes.includes(s.v)).map(x=>[x.v,x.t])}]},
  {k:'board',t:'Carte mère et ventilateur',fields:[{f:'board',t:'Puce',opts:B.BOARDS.filter(x=>x.sizes.includes(s.v)).map(x=>[x.v,x.t])}]},
  {k:'ram',t:'Mémoire LPCAMM2',fields:[{f:'ram',t:'Capacité',opts:B.RAMS.map(x=>[x.v,x.t])}]},
  {k:'sto',t:'SSD M.2',fields:[{f:'sto',t:'Capacité',opts:B.STOS.map(x=>[x.v,x.t])}]},
  {k:'kb',t:'Dessus : clavier et pavé',fields:[{f:'kb',t:'Disposition',opts:[['azerty','AZERTY'],['qwerty','QWERTY'],['qwertz','QWERTZ'],['bepo','BÉPO']]}]},
  {k:'bays',t:'Cartes de ports',fields:DS.cfg.ports.map((p,i)=>({f:'bay'+(i+1),t:'Baie '+(i+1),opts:i===0?[['usbc','USB-C (charge)']]:B.PORTS.map(x=>[x.v,x.t])}))}];}
function flatCfg(){const c=Object.assign({},DS.cfg);c.kb=c.kb||'azerty';c.ports.forEach((p,i)=>c['bay'+(i+1)]=p);delete c.ports;return c;}
async function swap(part,patch){post('swap:start',{part});$('#off').classList.add('on');await wait(2600);const c=DS.cfg;
  Object.keys(patch).forEach(k=>{let v=patch[k];if(/^bay\d+$/.test(k)){c.ports[+k.slice(3)-1]=v;return;}if(k==='ram'||k==='sto')v=+v;c[k]=v;});DS.cfg=B.fix(c);
  const u=DS.usage;DS.parts[part]={d:u.days,cy:u.cycles,tb:u.tbw,fh:u.fanH,k:u.keys,sh:u.scrH};const lab=catalog().find(p=>p.k===part);
  const val=part==='bays'?B.portsSum(DS.cfg):part==='ram'?DS.cfg.ram+' Go':part==='sto'?B.capL(DS.cfg.sto):part==='screen'?B.byV(B.SCREENS,DS.cfg.screen).t:part==='board'?B.byV(B.BOARDS,DS.cfg.board).t:String(DS.cfg.kb||'').toUpperCase();
  DS.history.unshift({t:lab?lab.t:part,v:val});save();await boot();ST.locked=true;renderLock();$('#plock').classList.remove('out');
  capAlert({w:340,l:'<span style="color:#8DB89A">'+S(G.check,2.4)+' Nouveau module</span>',r:esc((lab?lab.t:'')).slice(0,22)},3200);
  Object.values(W).forEach(w=>w.draw&&w.draw());const an=analyze();setTimeout(()=>notify('vertane',(lab?lab.t:'Module')+' installé',an.it[0]&&an.it[0].sev!=='ok'?an.it[0].t+'.':'Analyse terminée : '+an.score+'/100.'),1200);post('swap:done',{part});}

/* ---------- pont avec la page ---------- */
function post(evt,data){if(!EMBED)return;try{parent.postMessage({vos:1,evt,data:data||{}},'*');}catch(e){}}
let st=0;function sync(){clearTimeout(st);st=setTimeout(()=>post('state',{dev:'b1-'+model.k,name,setup:true,screen:ST.screen,locked:ST.locked,app:cur?cur.id:null,batt:DS.batt,charging:ST.charging,cfg:flatCfg(),catalog:catalog(),score:analyze().score,theme:DS.dark?'dark':'light'}),120);}
const CMD={power:()=>{if(ST.screen==='on'){ST.screen='off';$('#off').classList.add('on');lock();}else{ST.screen='on';$('#off').classList.remove('on');}sync();},powerLong:()=>ai(true),
  ai:d=>ai(true,d.text),cc:()=>togglePan('qs'),nc:()=>togglePan('ncp'),switcher:()=>expose(),home:()=>{Object.values(W).forEach(w=>{w.min=true;w.el.style.display='none';});cur=null;$('#appT').textContent='Bureau';},
  open:d=>{if(ST.locked)unlock().then(()=>openApp(d.app,d.args));else openApp(d.app,d.args);},unlock:()=>unlock(),
  notify:d=>{const P={msg:['msg','Léa Martin','Tu me montres la Capsule ce soir ?'],mail:['mail','Atelier Vertane','Ta carte Ethernet est expédiée.'],vertane:['vertane','Astuce Vertane','Glisse une fenêtre par sa barre, double-clique pour l’agrandir.'],cal:['vertane','Point projet','Dans 15 minutes, en visio.']};const n=P[d.app]||P.msg;notify(n[0],n[1],n[2]);},
  timer:d=>timer(d.sec||300),music:()=>music(true),
  call:d=>{const t0=Date.now();capSet('call',{w:230,l:'<span style="color:#34C46A">'+S(G.video,2)+'</span><span>'+esc(d.name||'Hugo')+'</span>',r:()=>'<span style="color:#34C46A">'+fmtS((Date.now()-t0)/1000)+'</span>',x:()=>'<div style="width:100%;display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;border-radius:50%;background:#3E6FB0;display:grid;place-items:center;font:600 18px/1 var(--font)">'+esc((d.name||'H')[0])+'</span><div style="flex:1"><div class="xt">Appel vidéo</div><div class="xs">'+esc(d.name||'Hugo')+' · caméra de l’écran</div></div><button class="xbtn red" data-e>'+S(G.phoneDown)+'</button></div>',bind:e=>{e.querySelector('[data-e]').onclick=()=>capDel('call');}});},
  charge:d=>{ST.charging=d.on!==false;renderBar();if(ST.charging)capAlert({w:220,l:'En charge',r:'<span style="color:#34C46A">'+DS.batt+' %</span>'});sync();},
  battery:d=>{DS.batt=clamp(d.level|0,1,100);renderBar();if(DS.batt<=15)notify('vertane','Batterie faible','Il reste '+DS.batt+' %. Branche le chargeur USB-C sur la baie 1.');sync();},
  swap:d=>swap(d.part,d.patch||{}),age:d=>{const k=(d.days||365)/365,u=DS.usage;u.days+=d.days||365;u.cycles+=Math.round(260*k);u.tbw+=14*k;u.fanH+=Math.round(1500*k);u.keys+=3*k;u.scrH+=1200*k;save();Object.values(W).forEach(w=>w.draw&&w.draw());notify('vertane','Bilan de santé','Ouvre l’app Vertane pour voir le niveau de vie de chaque pièce.');},
  reset:()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();},theme:d=>{DS.dark=d.theme==='dark';root.dataset.theme=DS.dark?'dark':'light';save();},state:()=>sync()};
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.vos||!CMD[m.cmd])return;try{CMD[m.cmd](m.data||{});}catch(err){console.error(err);}});

renderBar();renderDock();renderLock();capRender();
setTimeout(()=>{post('ready',{});sync();},50);
})();
</script>
</body>
</html>
