<html lang="fr">
<head>
<meta charset="utf-8">

<title>Acheter un Vertane P1</title>
<meta name="description" content="Achète ton Vertane P1 SE, P1, P1 Pro ou P1 Ultra, le téléphone pliant qui se répare, ou compose un P1 sur mesure, module par module.">
<meta name="theme-color" content="#F3F1EA">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/vertane-favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo/vertane-apple-touch-icon-180.png">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
.buy-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-top:112px;padding-bottom:28px}
.buy-head .eyebrow{margin-bottom:8px}
.buy-head p.muted{margin:10px 0 0;font-size:15px}
.head-links{display:flex;flex-wrap:wrap;gap:8px 24px}
.head-links .link{font-size:15px}

.buy-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:start}
.viewer-col{position:sticky;top:84px}
.viewer{position:relative;height:calc(100vh - 190px);height:calc(100svh - 190px);min-height:440px;max-height:860px;border-radius:var(--r-l);background:var(--blanc);overflow:hidden}
.viewer img{position:absolute;left:0;right:0;top:9%;margin:0 auto;height:74%;width:auto;max-width:none;opacity:0;transform:scale(.97);transition:opacity .55s var(--ease),transform .9s var(--ease-out);filter:drop-shadow(0 26px 34px rgba(22,24,26,.15))}
.viewer img.on{opacity:1;transform:none}
.v-cap{position:absolute;left:24px;top:22px;right:24px;margin:0;font-size:14px;color:var(--pierre);pointer-events:none;z-index:2}
.v-cap b{display:block;font:500 17px/1.3 var(--display);color:var(--noir);letter-spacing:-.01em;margin-bottom:2px}
.v-ctrl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(243,241,234,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(201,196,184,.6);z-index:2}
.v-ctrl button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:13.5px;color:var(--noir);transition:background .2s,color .2s}
.v-ctrl button:hover{background:rgba(22,24,26,.06)}
.v-ctrl button[aria-pressed="true"]{background:var(--noir);color:var(--ivoire)}

.step{padding:0 0 52px;margin-bottom:52px;border-bottom:1px solid var(--lin);scroll-margin-top:96px;transition:opacity .5s var(--ease)}
.step:last-child{border-bottom:0}
.step.locked{opacity:.34;pointer-events:none;user-select:none}
.step h2{font:500 clamp(24px,2.4vw,30px)/1.2 var(--display);letter-spacing:-.02em;margin:0 0 22px}
.step h2 span{color:var(--pierre)}
.step .help{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;margin-top:16px;color:var(--vert);font-size:15px}
.step .help svg{width:20px;height:20px}
.step .help:hover{text-decoration:underline;text-underline-offset:.18em}
.step-note{margin:14px 0 0;font-size:14px;color:var(--pierre)}
.col-name{font:600 15px/1.3 var(--text);margin:0 0 14px}
.col-name span{font-weight:400;color:var(--pierre)}
.step .swatches{gap:14px}
.step .sw{width:44px;height:44px}
.step .sw span{inset:5px}
.inc{margin-top:22px;border-radius:var(--r-m);background:var(--blanc);padding:4px 20px}
.inc summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;cursor:pointer;list-style:none;font-size:15px;font-weight:600}
.inc summary::-webkit-details-marker{display:none}
.inc summary svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.inc[open] summary svg{transform:rotate(180deg)}
.inc ul{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--lin-2)}
.inc li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--lin-2);font-size:14px}
.inc li:last-child{border-bottom:0}
.inc li span:first-child{color:var(--pierre)}
.inc li span:last-child{text-align:right}
.to-custom{display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:16px 20px;border-radius:var(--r-m);box-shadow:inset 0 0 0 1px var(--lin);font-size:14px;color:var(--pierre)}
.to-custom svg{width:24px;height:24px;flex:0 0 auto;color:var(--vert)}
.to-custom b{display:block;color:var(--noir);font-weight:600;margin-bottom:2px}
.to-custom button{border:0;background:none;padding:0;text-align:left;color:var(--vert);font-size:14px;margin-top:4px}
.to-custom button:hover{text-decoration:underline}
.trade-extra{display:grid;gap:14px;margin-top:18px}
.trade-val{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px;border-radius:var(--r-s);background:rgba(47,122,85,.08);color:var(--vert);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .choice{flex:1 1 90px;align-items:center;text-align:center;padding:14px 10px}

.recap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center;background:var(--blanc);border-radius:var(--r-l);padding:clamp(28px,5vw,64px);margin:24px 0 120px}
.recap-img{display:flex;justify-content:center}
.recap-img img{height:min(460px,60vw);width:auto;max-width:100%;object-fit:contain}
.recap ul{list-style:none;margin:22px 0;padding:0;border-top:1px solid var(--lin-2)}
.recap li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--lin-2);font-size:14.5px}
.recap li b{display:block;font-weight:600}
.recap li small{color:var(--pierre)}
.recap li span:last-child{white-space:nowrap}
.recap .tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 4px}
.recap .tot b{font:500 30px/1.1 var(--display);letter-spacing:-.03em}
.recap .ship{display:flex;gap:10px;align-items:flex-start;margin:18px 0 24px;font-size:14px;color:var(--pierre)}
.recap .ship svg{width:22px;height:22px;flex:0 0 auto;color:var(--noir)}
.recap .ship b{color:var(--noir);font-weight:600}

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -1px 0 rgba(201,196,184,.7);transform:translateY(110%);transition:transform .5s var(--ease-out)}
.buybar.on{transform:none}
.buybar .shell{display:flex;align-items:center;gap:16px 28px;min-height:76px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bb-price{display:flex;flex-direction:column}
.bb-price b{font:500 22px/1.15 var(--display);letter-spacing:-.02em}
.bb-price span{font-size:13px;color:var(--pierre)}
.bb-ship{margin-left:auto;font-size:13px;color:var(--pierre);text-align:right}
.bb-ship b{display:block;color:var(--noir);font-weight:600}

@media (max-width:980px){
  .buy-head{padding-top:96px}
  .buy-grid{grid-template-columns:1fr}
  .viewer-col{top:76px;z-index:5;margin:0 calc(-1*var(--gut));padding:0 var(--gut) 10px;background:linear-gradient(var(--ivoire) 88%,rgba(243,241,234,0));box-shadow:0 -90px 0 var(--ivoire)}
  .viewer{height:34svh;min-height:240px;border-radius:var(--r-m)}
  .viewer img{top:6%;height:80%}
  .v-cap{display:none}
  .v-ctrl{bottom:8px;padding:4px}.v-ctrl button{padding:6px 12px;font-size:12px}
  .step{scroll-margin-top:calc(76px + 34svh + 24px)}
  .recap{grid-template-columns:1fr}
  .bb-ship{display:none}
  .buybar .btn{margin-left:auto}
}

/* pliant : aperçu 3D, image fixe en attendant */
.viewer img{top:8%;height:80%;width:auto;object-fit:contain}
.viewer .v-3d{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease)}
.viewer.ready .v-3d{opacity:1}.viewer.ready #vFront{opacity:0}
.v-hint{position:absolute;right:24px;top:22px;margin:0;font-size:13px;color:var(--pierre);pointer-events:none;z-index:2}
.grp{margin-bottom:26px}
.grp:last-child{margin-bottom:0}
.grp .choices{gap:10px}
.grp .choice{padding:14px 18px}
.c-why{font-size:13px;color:#9A3A1E;margin-top:2px}
.sw-row{margin-bottom:22px}
.recap-img img{height:min(460px,60vw);width:auto;max-width:100%}
@media (max-width:980px){.viewer img{top:6%;height:84%}.v-hint{display:none}}
</style>
</head>
<body data-page="pliant">
<script src="assets/site.js"></script>
<main id="main">
  <header class="shell buy-head">
    <div><p class="eyebrow">Acheter</p><h1 class="h1" id="title">Vertane P1</h1><p class="muted" id="fromPrice"></p></div>
    <div class="head-links"><a class="link" href="telephones.html#comparer-p1">Comparer les P1</a><a class="link" href="acheter-pliant.html?m=mesure" id="toMesure">P1 sur mesure</a><a class="link" href="configurateur-p1.html" id="to3d">Configurateur 3D</a><a class="link" href="p1.html">Découvrir le P1</a></div>
  </header>
  <div class="shell buy-grid">
    <div class="viewer-col">
      <div class="viewer" id="viewer" aria-live="polite">
        <p class="v-cap" id="vcap"></p>
        <img id="vFront" alt="" class="on" width="760" height="900">
        <div class="v-3d" id="v3d"></div>
        <p class="v-hint" id="vHint"></p>
        <div class="v-ctrl" role="group" aria-label="Vue"><button data-v="flex" aria-pressed="true">Entrouvert</button><button data-v="open" aria-pressed="false">Déplié</button><button data-v="closed" aria-pressed="false">Plié</button><button data-v="closedBack" aria-pressed="false">Dos</button></div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </div>

</main>

<div class="buybar" id="buybar" aria-label="Prix et ajout au panier">
  <div class="shell">
    <div class="bb-price"><b id="bbPrice"></b><span id="bbMonthly"></span></div>
    <div class="bb-ship" id="bbShip"></div>
    <button class="btn" id="bbBtn">Continuer</button>
  </div>
</div>

<template id="foot-notes">
  <ol>
    <li>Paiement en 12 fois sans frais, sous réserve d’acceptation. Montants arrondis au centime supérieur. Prix TTC, livraison offerte en France métropolitaine.</li>
    <li>Valeur de reprise estimée, confirmée après inspection de l’appareil. Elle est déduite du total de la commande.</li>
    <li>Autonomie estimée en usage mixte, écran intérieur et extérieur. Estimations de prototype.</li>
  </ol>
</template>

<script src="assets/p1-data.js"></script>
<script>
(function(){
"use strict";
const P=window.P1,V=window.V,$=s=>document.querySelector(s),esc=V.esc,money=V.money;
const DEV=[['iphone-recent','iPhone de 2022 ou plus récent',220],['iphone-old','iPhone plus ancien',90],['pliant','Téléphone pliant de moins de 4 ans',300],['android-hdg','Android haut de gamme de moins de 4 ans',150],['android-mdg','Android milieu de gamme',60],['vertane','Téléphone Vertane',160],['autre','Autre appareil (recyclage gratuit)',0]];
const STATE=[['ok','Fonctionne parfaitement',1],['ecran','Écran ou dos fissuré',.5],['hs','Ne s’allume plus',.15]];
const CARE={name:'Vertane Care, 2 ans',price:149};
const FOLD={flex:.42,open:1,closed:0,closedBack:0};
const COMP=['inner','outer','board','cam','selfie','chem','port','spk','qi','fmat','cmat'];

/* état ; entrée par ?m=&c=&s=&edit=&from=config */
const qp=new URLSearchParams(location.search);
let m=P.byK(qp.get('m')),fin=null,cap=null,comp=null,cols=null,trade={on:null,dev:'',state:''},care=null,view='flex';
const done={modele:!!m};
if(!m)m=P.byK('p1');
const editId=qp.get('edit'),edited=editId&&V.Bag.items().find(x=>x.id===editId&&x.type==='fold');
if(edited){m=P.byK(edited.model)||m;done.modele=true;fin=edited.fin;cap=edited.cap;done.couleur=done.stockage=done.composants=true;
  if(m.k==='mesure'){comp={};COMP.concat('tier').forEach(k=>comp[k]=edited.cfg[k]);cols={fcol:edited.cfg.fcol,ccol:edited.cfg.ccol};}
  care=!!edited.care;if(edited.trade){trade={on:true,dev:edited.trade.dev||'',state:edited.trade.state||''};if(!trade.dev)trade.on=false;}else trade.on=false;}
if(!edited&&qp.get('c')&&m.fins.some(f=>f[0]===qp.get('c'))){fin=qp.get('c');done.couleur=true;}
if(!edited&&qp.get('s')&&m.caps.indexOf(+qp.get('s'))>=0){cap=+qp.get('s');done.stockage=true;}
/* arrivée depuis le configurateur 3D : on reprend toute la configuration */
if(!edited&&qp.get('from')==='config'&&m.k==='mesure')try{const s=JSON.parse(localStorage.getItem('p1-config-v1')||'null');
  if(s){const c=Object.assign({},P.DEF,s);P.fix(c);comp={};COMP.concat('tier').forEach(k=>comp[k]=c[k]);cols={fcol:c.fcol,ccol:c.ccol};cap=c.cap;done.composants=done.couleur=done.stockage=true;}}catch(e){}
function startMesure(c){c=c||P.cfgOf(P.byK('p1'));comp={};COMP.concat('tier').forEach(k=>comp[k]=c[k]);cols={fcol:c.fcol,ccol:c.ccol};}
if(m.k==='mesure'&&!comp)startMesure();

const steps=()=>[{k:'modele',t:'Modèle.',s:'Lequel est fait pour toi ?'}].concat(m.k==='mesure'?[{k:'composants',t:'Modules.',s:'Choisis chaque pièce.'}]:[],
  [{k:'couleur',t:'Couleur.',s:m.k==='mesure'?'Les cadres et la coque.':'Choisis ta finition.'},{k:'stockage',t:'Stockage.',s:'Quelle place pour tes photos ?'},
   {k:'reprise',t:'Reprise.',s:'As-tu un smartphone à faire reprendre ?'},{k:'care',t:'Vertane Care.',s:'Protège ton pliant.'}]);
const curFin=()=>fin||m.fins[0][0],curCap=()=>cap||m.caps[0];
function cfg(){if(m.k!=='mesure')return P.cfgOf(m,curFin(),curCap());const c=Object.assign({},P.DEF,comp,cols,{cap:curCap()});P.fix(c);return c;}
const price=()=>m.k==='mesure'?P.to9(P.price(cfg())):P.priceM(m,curCap());
function isDone(s){if(s.k==='reprise')return trade.on===false||(trade.on===true&&!!trade.dev&&!!trade.state);if(s.k==='care')return care!==null;return !!done[s.k];}
const unlockedIdx=()=>{const S=steps();let i=0;while(i<S.length&&isDone(S[i]))i++;return i;};
const allDone=()=>steps().every(isDone);
function tradeVal(){if(!trade.on||!trade.dev||!trade.state)return 0;const d=DEV.find(x=>x[0]===trade.dev),s=STATE.find(x=>x[0]===trade.state);return Math.round(d[2]*s[2]);}
const total=()=>price()+(care?CARE.price:0)-tradeVal();
const finName=()=>{const c=cfg();return m.k==='mesure'?P.colName(c.cmat,c.ccol)+', '+P.byV('cmat',c.cmat).t.toLowerCase():P.finOf(m,curFin())[1];};
/* image fixe la plus proche de la configuration */
function still(){const c=cfg();if(m.k!=='mesure')return P.img(m,curFin());const f=P.MESURE.fins.find(x=>x[2].cmat===c.cmat&&x[2].ccol===c.ccol)||P.MESURE.fins.find(x=>x[2].cmat===c.cmat)||P.MESURE.fins[0];return P.img(P.MESURE,f[0]);}

/* ---------- aperçu ---------- */
let lastK='';
function gallery(){const c=cfg(),f=$('#vFront'),src=still();if(f.getAttribute('src')!==src)f.src=src;f.alt='Vertane '+m.name+', '+finName();
  if(window.P3D){const k=JSON.stringify(P.d3(c));if(k!==lastK){lastK=k;window.P3D.set(P.d3(c));}}
  $('#viewer').querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===view));
  $('#vcap').innerHTML='<b>Vertane '+esc(m.name)+'</b>'+esc(finName()+(done.stockage?' · '+P.capL(curCap()):''));}
function setView(v,now){view=v;if(window.P3D){window.P3D.anim({open:FOLD[v],instant:!!now});window.P3D.view(v,!now);}gallery();}
window.addEventListener('p1-3d',()=>{$('#viewer').classList.add('ready');$('#vHint').textContent=window.P3D.touch?'':'Fais glisser pour tourner';lastK='';gallery();setView(view,true);});
$('#viewer').querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

/* ---------- étapes ---------- */
const radio=(name,v,on,dis)=>'<input type="radio" name="'+name+'" value="'+v+'"'+(on?' checked':'')+(dis?' disabled':'')+'>';
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const LABELS={inner:'Écran intérieur',outer:'Écran extérieur',board:'Carte mère',cam:'Photo, au dos',selfie:'Caméras selfie',chem:'Batterie',port:'Port de charge',spk:'Haut-parleurs',qi:'Recharge sans fil',fmat:'Cadres',cmat:'Coque arrière'};
const SUBS={inner:'8,0″ pliable',outer:'5,6″',board:'processeur, mémoire, modem',cam:'une seule caméra',selfie:'dehors et dedans',chem:'toute la moitié droite',port:'même technologie que le M1',spk:'même technologie que le M1',qi:'clipsée dans la coque',fmat:'les deux moitiés',cmat:'moitié gauche'};
function compGroup(f){const c=cfg(),cur=c[f],base=Math.min(...P.OPT[f].map(o=>o.p));
  return '<div class="grp"><p class="col-name">'+LABELS[f]+' <span>'+SUBS[f]+'</span></p><div class="choices" role="radiogroup" aria-label="'+LABELS[f]+'">'+P.OPT[f].map(o=>{const on=o.v===cur,w=on?null:P.why(f,o.v,c),d=o.p-base;
    return '<label class="choice'+(on?' on':'')+(w?' dis':'')+'">'+radio(f,o.v,on,!!w)+'<span class="c-row"><span class="c-t">'+esc(o.t)+(o.d?'<small>'+esc(o.d)+'</small>':'')+'</span><span class="c-p">'+(d>0?'+ '+money(d):'')+'</span></span>'+(w?'<span class="c-why">'+esc(w)+'</span>':'')+'</label>';}).join('')+'</div></div>';}
function sw(name,list,cur,label){return '<div class="sw-row"><p class="col-name">'+label+' <span>'+esc((list.find(x=>x[0]===cur)||list[0])[1])+'</span></p><div class="swatches" role="radiogroup" aria-label="'+label+'">'+list.map(x=>{const on=x[0]===cur;
  return '<label class="sw'+(on?' on':'')+'" title="'+esc(x[1])+'"><input type="radio" name="'+name+'" value="'+x[0]+'"'+(on?' checked':'')+' aria-label="'+esc(x[1])+'"><span style="--c:'+x[2]+'"></span></label>';}).join('')+'</div></div>';}
function stepHTML(s,i,ul){const locked=i>ul,id='etape-'+s.k,c=cfg();let b='';
  if(s.k==='modele'){b='<div class="choices" role="radiogroup" aria-label="Modèle">'+P.ALL.map(x=>{const on=done.modele&&x.k===m.k;
      return '<label class="choice'+(on?' on':'')+'">'+radio('model',x.k,on)+(x.tag?'<span class="c-tag">'+esc(x.tag)+'</span>':'')+'<span class="c-row"><span class="c-t">Vertane '+esc(x.name)+'<small>'+esc(x.pitch)+'</small></span><span class="c-p"><small>À partir de</small>'+money(P.from(x))+'</span></span><span class="c-d">'+esc(x.blurb)+'</span></label>';}).join('')+'</div>'+
    (m.k==='mesure'?'':'<details class="inc"><summary>Ce qui est inclus dans le '+esc(m.name)+CHEV+'</summary><ul>'+P.specs(c).map(r=>'<li><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></li>').join('')+
      '<li><span>Charnière</span><span>Double axe en goutte d’eau, 200 000 pliages, se change en 15 minutes</span></li></ul></details>'+
      '<div class="to-custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span><b>Envie de changer un module ?</b>Sur ce modèle, tu choisis la couleur et le stockage. Pour le reste, pars de ce modèle en sur mesure.<br><button type="button" id="toCustom">Personnaliser le '+esc(m.name)+' module par module</button></span></div>');}
  else if(s.k==='composants'){b=COMP.map(compGroup).join('')+(done.composants?'':'<button class="btn" type="button" id="compOk" style="margin-top:6px">Valider les modules</button>')+
      '<p class="step-note">La charnière double axe est la même sur tous les P1. Le port, le stockage, les haut-parleurs et la recharge sans fil reprennent la technologie des modules du M1, redessinés à la taille du P1.</p>';}
  else if(s.k==='couleur'){if(m.k==='mesure')b=sw('ccol',P.COLORS[c.cmat],c.ccol,'Couleur, '+P.byV('cmat',c.cmat).t.toLowerCase())+
      '<p class="step-note">La matière se choisit à l’étape Modules. Les cadres et la charnière prennent la couleur de la coque ; le plateau photo reste en noir fumé.</p>';
    else b='<p class="col-name">Couleur <span>'+esc(done.couleur?P.finOf(m,curFin())[1]:'À choisir')+'</span></p><div class="swatches" role="radiogroup" aria-label="Couleur">'+m.fins.map(f=>{const on=done.couleur&&f[0]===curFin();
      return '<label class="sw'+(on?' on':'')+'" title="'+esc(f[1])+'">'+radio('fin',f[0],on).replace('>',' aria-label="'+esc(f[1])+'">')+'<span style="--c:'+P.hex(m,f[0])+'"></span></label>';}).join('')+'</div>'+
      '<p class="step-note">'+esc((m.k==='se'?'Coque en plastique recyclé mat, cadres en aluminium recyclé de la même couleur.':m.k==='p1'?'Dos en verre recyclé dépoli, cadres en aluminium recyclé de la même couleur.':m.k==='pro'?'Coque en aluminium recyclé anodisé, cadres en titane de la même couleur.':'Dos en verre recyclé dépoli, cadres en titane de la même couleur.')+' Le plateau photo est toujours en noir fumé.')+'</p>';}
  else if(s.k==='stockage'){const b0=m.k==='mesure'?0:P.priceM(m,m.caps[0]);
    b='<div class="choices" role="radiogroup" aria-label="Capacité">'+m.caps.map(v=>{const on=done.stockage&&v===curCap();let d;
        if(m.k==='mesure'){const t=Object.assign({},c,{cap:v});d=P.to9(P.price(t))-P.to9(P.price(Object.assign({},c,{cap:m.caps[0]})));}else d=P.priceM(m,v)-b0;
      return '<label class="choice'+(on?' on':'')+'">'+radio('cap',v,on)+'<span class="c-row"><span class="c-t">'+P.capL(v)+'<small>'+esc(v<=256?'Pour sauvegarder en ligne':v<=512?'Photo et un peu de vidéo 4K':v<=1024?'Pour filmer beaucoup en 4K':'Tout garder sur toi, même les films')+'</small></span><span class="c-p">'+(d?'+ '+money(d):'')+'</span></span></label>';}).join('')+'</div>'+
    (m.k==='mesure'?'<div class="grp" style="margin-top:22px"><p class="col-name">Qualité de la mémoire</p><div class="choices" role="radiogroup">'+P.OPT.tier.map(o=>'<label class="choice'+(o.v===c.tier?' on':'')+'">'+radio('tier',o.v,o.v===c.tier)+'<span class="c-t">'+esc(o.t)+'<small>'+esc(o.d)+'</small></span></label>').join('')+'</div></div>':'')+
    '<p class="step-note">Android reste sur 128 Go soudés à la carte mère. Le module de stockage garde tes photos et tes fichiers, et se change en 30 secondes.</p>';}
  else if(s.k==='reprise'){b='<div class="choices two" role="radiogroup" aria-label="Reprise">'+
      '<label class="choice'+(trade.on===true?' on':'')+'">'+radio('trade','1',trade.on===true)+'<span class="c-t">Oui<small>Jusqu’à '+money(300)+' de réduction²</small></span></label>'+
      '<label class="choice'+(trade.on===false?' on':'')+'">'+radio('trade','0',trade.on===false)+'<span class="c-t">Non<small>Pas de reprise</small></span></label></div>';
    if(trade.on)b+='<div class="trade-extra"><div class="field"><select id="tDev" name="tDev"><option value=""'+(trade.dev?'':' selected')+' disabled>Choisir</option>'+DEV.map(d=>'<option value="'+d[0]+'"'+(trade.dev===d[0]?' selected':'')+'>'+esc(d[1])+'</option>').join('')+'</select><label for="tDev">Ton appareil</label></div>'+
      '<div><p class="col-name">Son état</p><div class="chips">'+STATE.map(x=>'<label class="choice'+(trade.state===x[0]?' on':'')+'">'+radio('tState',x[0],trade.state===x[0])+'<span class="c-t" style="font-size:14px">'+esc(x[1])+'</span></label>').join('')+'</div></div>'+
      (trade.dev&&trade.state?'<div class="trade-val"><span>Reprise estimée</span><span>− '+money(tradeVal())+'</span></div>':'')+
      '<p class="step-note">Tu reçois un kit d’envoi gratuit avec ton P1. Si l’appareil ne vaut rien, on le recycle gratuitement.</p></div>';}
  else if(s.k==='care'){b='<div class="choices" role="radiogroup" aria-label="Vertane Care">'+
      '<label class="choice'+(care===true?' on':'')+'">'+radio('care','1',care===true)+'<span class="c-row"><span class="c-t">Vertane Care, 2 ans</span><span class="c-p">'+money(CARE.price)+'</span></span><span class="c-d">Casse accidentelle et panne couvertes, écran intérieur et charnière compris, module de remplacement expédié en 24 h, batterie changée si elle descend sous 80 %.</span></label>'+
      '<label class="choice'+(care===false?' on':'')+'">'+radio('care','0',care===false)+'<span class="c-t">Sans Vertane Care<small>Garantie légale de 2 ans incluse</small></span></label></div>';}
  return '<section class="step'+(locked?' locked':'')+'" id="'+id+'" data-k="'+s.k+'" aria-labelledby="'+id+'-t"'+(locked?' aria-disabled="true"':'')+'><h2 id="'+id+'-t">'+s.t+' <span>'+s.s+'</span></h2>'+b+'</section>';}

const stepsEl=$('#steps');
function render(){const ul=unlockedIdx(),a=document.activeElement,fk=a&&a.name?[a.name,a.value,a.id]:null,inc=stepsEl.querySelector('.inc'),incOpen=inc&&inc.open;
  stepsEl.innerHTML=steps().map((s,i)=>stepHTML(s,i,ul)).join('');
  if(incOpen&&stepsEl.querySelector('.inc'))stepsEl.querySelector('.inc').open=true;
  if(fk){const el=(fk[2]&&document.getElementById(fk[2]))||stepsEl.querySelector('[name="'+fk[0]+'"][value="'+fk[1]+'"]');if(el)el.focus({preventScroll:true});}
  document.title='Acheter le Vertane '+m.name;$('#title').textContent='Vertane '+m.name;$('#toMesure').hidden=m.k==='mesure';$('#to3d').href='configurateur-p1.html'+(m.k!=='mesure'?'?m='+m.k+(fin?'&c='+fin:''):'');
  const p=m.k==='mesure'?price():P.from(m);$('#fromPrice').textContent=(m.k==='mesure'?'Ta configuration : ':'À partir de ')+money(p)+' ou '+V.monthly(p)+'/mois sur 12 mois¹';
  gallery();summary();recap();}

function eta(){const d=new Date();let n=0;while(n<5){d.setDate(d.getDate()+1);if(d.getDay()%6)n++;}return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function summary(){const ok=allDone(),left=steps().filter(s=>!isDone(s)).length;
  $('#bbPrice').textContent=money(ok?total():price());
  $('#bbMonthly').textContent=ok?'ou '+V.monthly(total())+'/mois sur 12 mois¹':'Encore '+left+' étape'+(left>1?'s':'')+' à choisir';
  $('#bbShip').innerHTML='<b>Livraison gratuite</b>Livré au plus tard le '+eta();
  $('#bbBtn').textContent=ok?'Ajouter au panier':'Continuer';
  $('#buybar').classList.toggle('on',!!done.modele);}
function lines(){const c=cfg();return [['Couleur',finName()],['Stockage',P.capL(c.cap)+', qualité '+P.byV('tier',c.tier).t]].concat(P.specs(c).filter(r=>['Plié','Déplié','Masse','Autonomie'].indexOf(r[0])<0));}
/* image fidèle à la configuration (3D), sinon le rendu du modèle */
let shotK='',shotU='';
function shot(){const c=cfg();if(!window.P3D)return still();const k=JSON.stringify(P.d3(c));if(k!==shotK){shotK=k;const o=window.P3D.state.open;window.P3D.anim({open:0,instant:true});
  shotU=window.P3D.snapView('closedBack',760,900,'image/webp',.86);window.P3D.anim({open:o,instant:true});}return shotU;}
function recap(){const r=$('#recap');if(!allDone()){r.hidden=true;return;}r.hidden=false;const c=cfg();
  const li='<li><span><b>Vertane '+esc(m.name)+'</b><small>'+esc(finName()+', '+P.capL(c.cap))+'</small></span><span>'+money(price())+'</span></li>'+
    (care?'<li><span><b>'+CARE.name+'</b></span><span>'+money(CARE.price)+'</span></li>':'')+
    (tradeVal()?'<li><span><b>Reprise estimée²</b><small>'+esc(DEV.find(d=>d[0]===trade.dev)[1])+'</small></span><span>− '+money(tradeVal())+'</span></li>':'');
  r.innerHTML='<div class="recap-img"><img src="'+shot()+'" alt="Ton Vertane '+esc(m.name)+'"></div><div><p class="eyebrow">Récapitulatif</p><h2 class="h2" id="recap-t">Ton Vertane '+esc(m.name)+' est prêt.</h2>'+
    '<p class="muted" style="margin:10px 0 0;font-size:15px">'+Math.round(P.hours(c))+' h d’autonomie³ · 11,5 mm plié · '+P.mass(c)+' g</p><ul>'+li+'</ul>'+
    '<div class="tot"><span>Total</span><b>'+money(total())+'</b></div><p class="muted" style="margin:0;text-align:right;font-size:14px">ou '+V.monthly(total())+'/mois sur 12 mois¹</p>'+
    '<div class="ship"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2" fill="#fff"/><circle cx="18" cy="18" r="2" fill="#fff"/></svg><span><b>Livraison gratuite.</b> Livré au plus tard le '+eta()+'. Retours gratuits pendant 30 jours.</span></div>'+
    '<button class="btn btn-lg btn-block" id="addBag">'+(edited?'Mettre à jour le panier':'Ajouter au panier')+'</button></div>';}

/* ---------- interactions ---------- */
function url(){history.replaceState(null,'','?m='+m.k+(fin?'&c='+fin:'')+(cap?'&s='+cap:'')+(editId?'&edit='+editId:''));}
stepsEl.addEventListener('change',e=>{const t=e.target,n=t.name;if(!n)return;
  if(n==='model'){const nm=P.byK(t.value);if(!nm)return;const first=!done.modele;
    if(nm.k==='mesure'&&m.k!=='mesure'){startMesure(cfg());done.composants=false;}
    m=nm;done.modele=true;
    if(fin&&!m.fins.some(f=>f[0]===fin)){fin=null;done.couleur=m.k==='mesure'?done.couleur:false;}if(cap&&m.caps.indexOf(cap)<0){cap=null;done.stockage=false;}
    url();setView('flex');render();if(first||!isDone(steps()[1]))next('modele');return;}
  if(COMP.indexOf(n)>=0){const o=P.OPT[n].find(x=>String(x.v)===t.value);if(!o)return;comp[n]=o.v;const c=cfg();comp.qi=c.qi;comp.inner=c.inner;comp.cam=c.cam;comp.port=c.port;
    if(n==='cmat'&&!P.COLORS[c.cmat].some(x=>x[0]===cols.ccol))cols.ccol=P.COLORS[c.cmat][0][0];cols.fcol=cols.ccol;
    render();if(['cmat','fmat','cam','qi'].indexOf(n)>=0)setView('closedBack');else if(n==='inner')setView('open');else if(n==='outer')setView('closed');return;}
  if(n==='ccol'||n==='fcol'){cols.ccol=cols.fcol=t.value;const first=!done.couleur;done.couleur=true;setView('closedBack');render();if(first)next('couleur');return;}
  if(n==='fin'){const first=!done.couleur;fin=t.value;done.couleur=true;url();setView('closedBack');render();if(first)next('couleur');return;}
  if(n==='cap'){const first=!done.stockage;cap=+t.value;done.stockage=true;url();render();if(first)next('stockage');return;}
  if(n==='tier'){comp.tier=t.value;render();return;}
  if(n==='trade'){trade.on=t.value==='1';if(!trade.on){trade.dev='';trade.state='';}render();if(!trade.on)next('reprise');return;}
  if(n==='tDev'){trade.dev=t.value;render();return;}
  if(n==='tState'){trade.state=t.value;render();if(isDone(steps().find(s=>s.k==='reprise')))next('reprise');return;}
  if(n==='care'){care=t.value==='1';render();return;}});
function next(k){const S=steps(),i=S.findIndex(s=>s.k===k),n=S.slice(i+1).find(s=>!isDone(s));if(!n)return;setTimeout(()=>{const el=document.getElementById('etape-'+n.k);if(el&&el.getBoundingClientRect().top>innerHeight*.55)el.scrollIntoView({behavior:V.reduce?'auto':'smooth',block:'start'});},250);}
function goStep(k){const el=document.getElementById('etape-'+k);if(el)el.scrollIntoView({behavior:V.reduce?'auto':'smooth',block:'start'});}
stepsEl.addEventListener('click',e=>{
  if(e.target.id==='toCustom'){const c=cfg();startMesure(c);cap=c.cap;m=P.MESURE;fin=null;done.composants=false;done.couleur=true;url();render();goStep('composants');}
  if(e.target.id==='compOk'){done.composants=true;render();next('composants');}});
$('#bbBtn').addEventListener('click',()=>{if(allDone())add();else goStep(steps().find(x=>!isDone(x)).k);});
document.addEventListener('click',e=>{if(e.target.id==='addBag')add();});

function add(){if(!allDone())return;const c=cfg(),mesure=m.k==='mesure';
  const item={type:'fold',model:m.k,fin:mesure?c.cmat+'-'+c.ccol:curFin(),cap:c.cap,sku:'P1-'+m.k.toUpperCase()+'-'+(mesure?COMP.map(k=>String(c[k]).slice(0,3).toUpperCase()).join('')+'-'+c.fcol.toUpperCase()+'-'+c.ccol.toUpperCase():curFin().toUpperCase())+'-'+c.cap,
    name:'Vertane '+m.name,cfg:c,img:shot(),lines:lines(),price:price(),care:care?{name:CARE.name,price:CARE.price}:null,
    trade:tradeVal()?{label:DEV.find(d=>d[0]===trade.dev)[1]+', '+STATE.find(s=>s[0]===trade.state)[1].toLowerCase(),value:tradeVal(),dev:trade.dev,state:trade.state}:null,
    specs:finName()+' · '+P.capL(c.cap)+' · pliant 8,0″'};
  if(edited){item.qty=edited.qty;V.Bag.remove(edited.id);}
  const id=V.Bag.add(item);location.href='panier.html?ajout='+encodeURIComponent(id);}

render();
})();
</script>
<script src="assets/walls.js"></script>
<script src="assets/p1-3d.js"></script>
<script>
(async function(){const touch=matchMedia('(pointer:coarse)').matches;
try{const v=await window.mountP1(document.getElementById('v3d'),{interactive:!touch,noZoom:true,reduce:window.V.reduce});v.touch=touch;window.P3D=v;window.dispatchEvent(new Event('p1-3d'));}
catch(e){console.warn('3D indisponible, rendu fixe affiché',e);}})();
</script>
</body>
